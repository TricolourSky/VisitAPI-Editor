let page="about",picked=false;
const STATUS=["Locked","AvailableForStart","Started","AvailableForFinish","Success","Fail"];
const SHORTK=["st0","st1","st2","st3","st4","st5"];
const shortStatus=()=>SHORTK.map(T);
const RESERVED=["@close","@leave","@trade","@services","@tasks","@visit","@start"];

/* ══ .dlg 解析器（对齐插件里的 DialogParser.cs）══ */
function parseDlg(text){
  /* headRaw 按原顺序记下文件头每一行（含注释），存盘时照原样吐回去，
     否则回写会把用户写的注释和行序全洗掉——SORA 那两条坐标注释就是这么丢的 */
  const t={trader:null,name:null,start:"root",first:null,tab:null,tabS:[],when:[],triggers:[],
           alias:{},aliasOrder:[],nodes:{},headRaw:[],warn:[]};
  let n=null,ln=0;
  /* 攒着的注释：碰到下一个元素就挂到它头上（和 C# 的 DialogParser 同一套做法）。
     以前这里是"进了节点就直接丢"，于是节点体里的注释存一次就没了 —— SORA 那份
     注释恰好全在文件头，所以一直没暴露。 */
  let pend=[];
  const take=()=>{const p=pend;pend=[];return p;};
  const KV=segs=>{const d={};segs.forEach(s=>{const i=s.indexOf(":");
    if(i>0)d[s.slice(0,i).trim().toLowerCase()]=s.slice(i+1).trim();});return d;};
  const A=id=>id&&t.alias[id]?t.alias[id]:id;
  const ST=s=>{s=s.trim();const i=parseInt(s,10);
    if(!isNaN(i)&&i>=0&&i<=5)return i;
    const k=STATUS.findIndex(x=>x.toLowerCase()===s.toLowerCase());
    if(k<0)t.warn.push(`第 ${ln} 行: 未知任务状态 '${s}'`);return k;};
  const gate=(v,into)=>{const e=v.indexOf("=");
    if(e<0){t.warn.push(`第 ${ln} 行: 门控缺少 '=状态'`);return v.trim();}
    v.slice(e+1).split("/").forEach(s=>into.push(ST(s)));return v.slice(0,e).trim();};

  for(const raw of text.replace(/\r\n/g,"\n").split("\n")){
    ln++;const line=raw.trim();
    if(!line||line[0]==="#"||line.startsWith("//")){
      if(!n)t.headRaw.push({k:"raw",v:line});          /* 文件头里的注释和空行都要留住（空行是作者的分段） */
      else if(line)pend.push(line);                    /* 节点体里的挂到下一个元素上 */
      continue;}
    const head=line.match(/^<([\w.\-]+)>\s*(.*)$/);
    if(head){const d=KV(head[2].split(" | "));
      /* 归属规则和 C# 的 DialogParser 逐行对齐：<节点> 前面那几行注释算**上一个节点的尾巴**，
         只有第一个节点之前的才算它自己的头。两边不一致的话，回写位置就会漂。 */
      if(n)n.tail=take();
      n=t.nodes[head[1]]={name:head[1],bg:d.bg||"",anim:d.anim,bgm:d.bgm,narr:[],npc:"",jump:null,opts:[],
                          lead:take(),npcLead:[],jumpLead:[],tail:[]};
      continue;}
    if(!n){ /* 文件头 */
      const qa=line.match(/^quest\s+(\S+)\s*=\s*(\S+)$/i);
      if(qa){t.alias[qa[1]]=qa[2];t.aliasOrder.push(qa[1]);
        t.headRaw.push({k:"quest",i:t.aliasOrder.length-1});continue;}
      const i=line.indexOf(":");const k=(i<0?line:line.slice(0,i)).trim().toLowerCase();
      const v=i<0?"":line.slice(i+1).trim();
      t.headRaw.push({k,i:k==="trigger"?t.triggers.length:k==="when"?t.when.length:0});
      /* 这一行没能变成模型（语法错、或我们不认识的头）：把刚占的位子换成原文照抄 */
      const keepRaw=()=>{t.headRaw.pop();t.headRaw.push({k:"raw",v:line});};
      if(k==="trader"){const m=v.match(/^(\S+)?\s*"(.*)"/);
        if(m){t.trader=m[1]||null;t.name=m[2];}else t.name=v;}
      else if(k==="start")t.start=v; else if(k==="first")t.first=v;
      /* 这两行进模型（界面上能改），头行的位置按 k 记着，回写由 DialogWriter 重新生成。
         以前是"存下值、同时把整行当原文留住"——那时没有入口，改不了才没露馅。 */
      else if(k==="actor")t.actor=v; else if(k==="scene")t.scene=v;
      /* 进不了模型的行必须**原文留住**（keepRaw）。不留的话回写时 DialogWriter 对这条头行
         拿不到值就返回 null，整行会从作者的文件里悄悄消失 —— 4.0.13 的 `tab: always`
         和写坏的 `when:` 都会这么被吃掉。C# 的 DialogHeaderParser 也是这么处理的，两边必须一致。 */
      else if(k==="tab"){if(v.startsWith("if "))t.tab=gate(v.slice(3),t.tabS);
        else{keepRaw();t.warn.push(`第 ${ln} 行: tab 只认 'if <任务>=<状态>'`);}}
      else if(k==="when"){const w=v.match(/^(.*?)\s*->\s*(\S+)$/);
        const conds=w?[...w[1].matchAll(/(level|standing)\s*(>=|<=)\s*([-+\d.]+)/g)]
          .map(c=>({f:c[1],le:c[2]==="<=",v:parseFloat(c[3])})):[];
        if(conds.length)t.when.push({node:w[2],conds});
        else{keepRaw();t.warn.push(`第 ${ln} 行: when 无法解析 '${v}'`);}}
      else if(k==="trigger")t.triggers.push(v);
      else{keepRaw();t.warn.push(`第 ${ln} 行: 未知的文件头 '${k}'`);}
      continue;}
    /* 节点体 */
    const seg=line.split(" | ");
    if(line.startsWith("->")){n.jump=line.slice(2).trim();n.jumpLead=take();continue;}
    if(line.startsWith(">")){const d=KV(seg.slice(1));
      /* anim 也要收：以前只收了 bg/audio，旁白上的 anim 存一次就没了 */
      n.narr.push({text:seg[0].slice(1).trim(),bg:d.bg||"",anim:d.anim,audio:d.audio,lead:take()});continue;}
    if(line.startsWith("- ")){
      const o={t:"",to:null,act:null,gate:null,gate2:null,once:false,always:false,
               standing:null,setst:null,lead:take()};
      const left=seg[0].slice(2).trim();const ar=left.indexOf(" -> ");
      o.t=(ar<0?left:left.slice(0,ar)).trim();
      o.to=ar<0?null:left.slice(ar+4).trim();
      seg.slice(1).flatMap(s=>s.split(",")).map(s=>s.trim()).filter(Boolean).forEach(d=>{
        if(d==="once"){o.once=true;return;} if(d==="always"){o.always=true;return;}
        const c=d.indexOf(":");if(c<0){t.warn.push(`第 ${ln} 行: 未知指令 '${d}'`);return;}
        const key=d.slice(0,c).trim().toLowerCase(),v=d.slice(c+1).trim();
        const sp=v.indexOf(" "),eq=v.indexOf("=");
        if(key==="accept")o.act={kind:"accept",q:A(v)};
        else if(key==="complete")o.act={kind:"complete",q:A(v)};
        else if(key==="handover")o.act={kind:"handover",q:A(sp<0?v:v.slice(0,sp)),label:sp<0?null:v.slice(sp+1).trim()};
        else if(key==="setstatus"){o.setst={q:A(eq<0?v:v.slice(0,eq).trim()),v:eq<0?3:ST(v.slice(eq+1))};}
        /* 一个选项上 if 和 ifnot 可以同时存在。界面只编辑 gate 这一个，
           另一个原样搁在 gate2 里带回去 —— 不然存一次就少一条门控。 */
        else if(key==="if"||key==="ifnot"){const s=[];const g={kind:key,q:A(gate(v,s)),s};
          if(!o.gate)o.gate=g; else o.gate2=g;}
        else if(key==="standing")o.standing={who:eq<0?null:v.slice(0,eq).trim(),d:parseFloat(eq<0?v:v.slice(eq+1))||0};
        else t.warn.push(`第 ${ln} 行: 未知指令 '${key}'`);});
      n.opts.push(o);continue;}
    n.npc=seg[0].trim();n.npcLead=take();
    const d=KV(seg.slice(1));if(d.audio)n.audio=d.audio;
  }
  if(n)n.tail=(n.tail||[]).concat(pend);        /* 文件末尾剩下的注释 */
  /* 跳转校验 */
  Object.values(t.nodes).forEach(nd=>{
    [...nd.opts.map(o=>o.to),nd.jump].forEach(tg=>{
      if(tg&&!t.nodes[tg]&&!RESERVED.includes(tg))
        t.warn.push(`节点 <${nd.name}>: 跳转目标 '${tg}' 不存在`);});});
  return t;
}
/* 有草稿就先吃草稿——刷新一下不至于把刚写的剧情全丢了。
   草稿解析失败（比如以前存的格式变了）就退回原文件，不能因为草稿坏了整页打不开。 */
/* ══ 与本地服务端通信 ══
   令牌由服务端注入页面（见 Program.Ui）。所有碰文件的接口都要带上它，
   这样即使别的网页知道了端口，也拿不到令牌，改不了你的文件。 */
const TOK=document.querySelector('meta[name=tok]')?.content||"";
const api=(u,o={})=>fetch(u,{...o,headers:{...(o.headers||{}),"X-Token":TOK}})
  .then(async r=>{if(!r.ok)throw new Error((await r.text())||r.status);
    return r.headers.get("content-type")?.includes("json")?r.json():r.text();});

let filePath=null, dirty=false, savedText="";
/* savedText = 上次载入/保存时的文本。判断"脏"靠跟它比对，
   而不是"refresh 跑过就算改过"——切页面、切语言也会 refresh，那样会一直误报未保存。 */
/* 起手先用内置样例把界面撑起来；真文件由「打开」面板载入后 loadDoc() 换掉 */
let doc=parseDlg(srcText());

/* ══ 入口节点：start / first / when 目标 / trigger 的 node 参数 ══
   —— trigger 入口最容易被漏掉：SORA 剧本里 C/D/D4/D10 全靠藏身处触发点进入，
      不算进来的话它们会被判成"深度未知"，全堆进第 0 列，图就竖成一条。 */
function triggerEntries(){
  const s=new Set();
  doc.triggers.forEach(tr=>{const m=tr.match(/\bnode\s+([\w.\-]+)/);
    if(m&&doc.nodes[m[1]])s.add(m[1]);});
  return s;}
let TRIG=triggerEntries();
function entryNodes(){
  const e=new Set(TRIG);
  [doc.start,doc.first,...doc.when.map(w=>w.node)].forEach(x=>{if(doc.nodes[x])e.add(x);});
  return e;}

/* ══ 自动布局：先分弱连通分量，每条故事线各占一条横带 ══ */
/* 流程区现在是右半边（窄而高），不再是通栏（宽而扁），
   所以装箱的目标长宽比不能写死——渲染后拿真实面板尺寸再排一次。 */
let LAYOUT_TARGET=1.35;
function autoLayout(){
  const names=Object.keys(doc.nodes),out={},inn={};
  names.forEach(n=>{out[n]=[];inn[n]=[];});
  names.forEach(n=>doc.nodes[n].opts.map(o=>o.to).concat(doc.nodes[n].jump).forEach(to=>{
    if(to&&doc.nodes[to]){out[n].push(to);inn[to].push(n);}}));
  const seen={},comps=[];
  names.forEach(n=>{if(seen[n])return;
    const stack=[n],mem=[];seen[n]=1;
    while(stack.length){const k=stack.pop();mem.push(k);
      out[k].concat(inn[k]).forEach(m=>{if(!seen[m]){seen[m]=1;stack.push(m);}});}
    comps.push(mem);});
  /* ── 每个分量先单独分层，算出相对坐标和自身尺寸 ── */
  const E=entryNodes(),CW=252,RH=128,blocks=[];
  comps.forEach(mem=>{
    const set=new Set(mem);
    let seeds=mem.filter(n=>E.has(n));
    if(!seeds.length)seeds=mem.filter(n=>inn[n].length===0);
    if(!seeds.length)seeds=[mem[0]];
    const dep={};seeds.forEach(s=>dep[s]=0);
    for(let it=0;it<mem.length+2;it++){let ch=false;      /* 最长路分层，迭代上限防环 */
      mem.forEach(u=>{if(dep[u]===undefined)return;
        out[u].forEach(v=>{if(!set.has(v))return;
          if(dep[v]===undefined||dep[v]<dep[u]+1){dep[v]=dep[u]+1;ch=true;}});});
      if(!ch)break;}
    mem.forEach(n=>{if(dep[n]===undefined)dep[n]=0;});
    const cols={};mem.forEach(n=>(cols[dep[n]]??=[]).push(n));
    const rel={};let w=0,h=0;
    Object.entries(cols).forEach(([d,ks])=>{
      ks.sort((a,b)=>(inn[a][0]||"").localeCompare(inn[b][0]||"")||a.localeCompare(b));
      ks.forEach((k,i)=>{rel[k]=[(+d)*CW,i*RH];});
      w=Math.max(w,(+d+1)*CW);h=Math.max(h,ks.length*RH);});
    blocks.push({rel,w,h,label:seeds.map(s=>
      (TRIG.has(s)?"⚑ ":s===doc.start?"▶ ":"")+"<"+s+">").join("  ·  ")});});

  /* ── 再把这些分量按行装箱。行宽不写死：试几个值，取整张图长宽比
        最接近节点面板（约 3.2:1）的那个，免得图要么细长要么高瘦 ── */
  const hasStart=b=>doc.nodes[doc.start]&&b.rel[doc.start]!==undefined;
  blocks.sort((a,b)=>(hasStart(b)?1:0)-(hasStart(a)?1:0)||b.h-a.h||b.w-a.w);
  const pack=maxw=>{
    const put=[];let px=30,py=44,rowH=0,W=0;
    blocks.forEach(b=>{
      if(px>30&&px+b.w>maxw){px=30;py+=rowH+78;rowH=0;}
      put.push({b,x:px,y:py});px+=b.w+56;rowH=Math.max(rowH,b.h);
      W=Math.max(W,px-56);});
    return {put,w:W-30,h:py+rowH-44};};
  const TARGET=LAYOUT_TARGET;
  let best=null;
  [560,760,900,1200,1500,1900,2400,3000,3800].forEach(m=>{
    const p=pack(m),score=Math.abs(Math.log((p.w/Math.max(p.h,1))/TARGET));
    if(!best||score<best.score)best={...p,score};});
  doc.bands=[];
  best.put.forEach(({b,x,y})=>{
    doc.bands.push({x,y:y-17,label:b.label});
    Object.entries(b.rel).forEach(([k,[rx,ry]])=>{
      doc.nodes[k].x=x+rx;doc.nodes[k].y=y+ry;});});
}
autoLayout();
let relaid=false;
/* 渲染后按流程区的真实长宽比重排一次；用户拖过节点就不再自动重排了 */
function relayout(){
  const g=$("graph");if(!g||relaid)return;
  const r=g.getBoundingClientRect();if(r.width<40||r.height<40)return;
  LAYOUT_TARGET=Math.max(.5,Math.min(4,(r.width-46)/r.height));
  autoLayout();relaid=true;drawGraph();fit();}

let cur=doc.first&&doc.nodes[doc.first]?doc.first:doc.start,beat=0,gx=14,gy=10,gs=.8;
const N=()=>doc.nodes[cur];
const isTalk=()=>beat===N().narr.length;
/* String(s??"")：早先写的是 (s||"")，传个数字进来就 "replace is not a function"。
   模板里 esc(数量) 这种太自然了，helper 自己扛住比每个调用处都记得转要靠谱。
   引号也要转义 —— 这些值会进 title="…" / data-…="…"，不转就能把属性顶出去。 */
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const isReal=t=>!!doc.nodes[t], isRsv=t=>RESERVED.includes(t);
const icoFor=o=>o.act?.kind==="accept"?ICON.quest:o.act?ICON.finish:
  o.to==="@close"||!o.to?ICON.quit:o.to==="@trade"?ICON.trade:ICON.talk;
const shortQ=q=>q?("…"+String(q).slice(-4)):"";

/* ══ 壁纸：工程图纸 ══
   不是星空了——这套风格底子是"施工图"：大网格 + 细网格 + 一条缓慢扫过的
   橙色测量线 + 四角刻度。动的东西只有那一条线，别的全静止，才像仪表不像屏保。 */
(function(){const c=$("sky"),x=c.getContext("2d");let t=0,W=0,H=0;
  function init(){W=c.width=innerWidth;H=c.height=innerHeight;}
  function grid(step,color){x.strokeStyle=color;x.lineWidth=1;x.beginPath();
    for(let i=step;i<W;i+=step){x.moveTo(i+.5,0);x.lineTo(i+.5,H);}
    for(let j=step;j<H;j+=step){x.moveTo(0,j+.5);x.lineTo(W,j+.5);}x.stroke();}
  function paint(anim){const light=theme==="light";
    const g=x.createLinearGradient(0,0,W*.5,H);
    if(light){g.addColorStop(0,"#D2CEC4");g.addColorStop(1,"#BEBAB0");}
    else{g.addColorStop(0,"#101216");g.addColorStop(.55,"#0A0B0E");g.addColorStop(1,"#07080A");}
    x.fillStyle=g;x.fillRect(0,0,W,H);
    grid(28,light?"rgba(20,22,26,.045)":"rgba(255,255,255,.022)");
    grid(140,light?"rgba(20,22,26,.085)":"rgba(255,255,255,.05)");
    /* 缓慢横扫的测量线 */
    const y=((anim?t*.35:0)%(H+300))-150;
    const lg=x.createLinearGradient(0,y-60,0,y+60);
    lg.addColorStop(0,"rgba(242,226,5,0)");
    lg.addColorStop(.5,light?"rgba(200,186,0,.18)":"rgba(242,226,5,.12)");
    lg.addColorStop(1,"rgba(242,226,5,0)");
    x.fillStyle=lg;x.fillRect(0,y-60,W,120);
    x.strokeStyle=light?"rgba(190,176,0,.35)":"rgba(242,226,5,.28)";x.lineWidth=1;
    x.beginPath();x.moveTo(0,y+.5);x.lineTo(W,y+.5);x.stroke();
    /* 四角刻度括号 */
    const m=18,L=26;x.strokeStyle=light?"rgba(20,22,26,.22)":"rgba(255,255,255,.14)";x.lineWidth=2;
    [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([px,py,sx,sy])=>{
      x.beginPath();x.moveTo(px+sx*L,py);x.lineTo(px,py);x.lineTo(px,py+sy*L);x.stroke();});}
  init();addEventListener("resize",()=>{init();paint(false);});
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)paint(false);
  else(function f(){t++;paint(true);requestAnimationFrame(f);})();})();

/* 条码 = 一根线一个节点：入口画橙，触发器入口画青，普通灰。
   纯装饰的条码我不画——这条是真读数据的。 */
function drawBars(){
  const el=$("bars");if(!el)return;
  const E=entryNodes();
  el.innerHTML=Object.keys(doc.nodes).map(n=>
    `<i class="${TRIG.has(n)?"t":E.has(n)?"e":""}"></i>`).join("");}
function drawRail(){
  const el=$("bandrail");if(!el||!doc.bands||!doc.bands.length)return;
  const ns=Object.values(doc.nodes);if(!ns.length)return;
  const miny=Math.min(...ns.map(n=>n.y)),maxy=Math.max(...ns.map(n=>n.y+130));
  const H=Math.max(1,maxy-miny);
  el.innerHTML=doc.bands.map((b,i)=>{
    const seed=(b.label.match(/<([\w.\-]+)>/)||[])[1]||"";
    const cls=seed===doc.start?"s":TRIG.has(seed)?"t":entryNodes().has(seed)?"e":"";
    const top=Math.max(0,Math.min(97,(b.y+17-miny)/H*100));
    return `<i class="${cls}" style="top:calc(6px + ${top.toFixed(2)}% )" data-b="${i}" title="${esc(b.label)}"></i>`;
  }).join("");
  el.querySelectorAll("i").forEach(t=>t.onclick=e=>{
    e.stopPropagation();
    const b=doc.bands[+t.dataset.b],r=$("graph").getBoundingClientRect();
    gx=40-b.x*gs;gy=(r.height*.28)-b.y*gs;applyView();
    el.querySelectorAll("i").forEach(o=>o.classList.remove("on"));t.classList.add("on");});}
function telem(){
  if(!$("telZoom"))return;
  const links=Object.values(doc.nodes)
    .reduce((a,n)=>a+n.opts.filter(o=>o.to&&isReal(o.to)).length+(n.jump&&isReal(n.jump)?1:0),0);
  $("telZoom").textContent=Math.round(gs*100)+"%";
  $("telNodes").textContent=Object.keys(doc.nodes).length;
  $("telEntry").textContent=entryNodes().size;
  $("telLinks").textContent=links;}

/* 画布 */
function curBg(){const n=N();
  if(!isTalk()&&n.narr[beat]?.bg)return n.narr[beat].bg;
  return n.bg;}
function drawStage(){
  const b=curBg(),layer=$("bglayer");
  layer.innerHTML="";layer.style.backgroundImage="";
  layer.classList.toggle("empty",!b);
  const asset=ASSETS.bg.find(a=>a.name.toLowerCase()===String(b||"").toLowerCase());
  if(b&&asset&&asset.video){
    const v=document.createElement("video");v.src=mediaUrl(asset.name);
    v.autoplay=v.loop=v.muted=v.playsInline=true;layer.appendChild(v);}
  else if(b&&asset) layer.style.backgroundImage=`url("${mediaUrl(asset.name)}")`;
  else if(b) layer.innerHTML=`<div class="bghint">${b} ${T("bg_missing")}<br><small>${
      !WS.ok?T("why_nows"):!WS.hasBg?T("why_nobg"):T("why_nofile")}</small></div>`;
  else layer.innerHTML=`<div class="bghint">${T("bg_set")}</div>`;
  $("bgtag").textContent=b?"bg: "+b:"";
  drawBody();drawBeats();}
function drawBody(){
  const n=N();
  if(!isTalk()){
    $("body").innerHTML=`<div class="narr" contenteditable="plaintext-only" data-ph="${T('ph_narr')}">${esc(n.narr[beat].text)}</div>`;
    $("body").querySelector(".narr").oninput=e=>{n.narr[beat].text=e.target.textContent;soft();};return;}
  const jumpRow=n.jump?`<div class="optrow"><span style="width:18px"></span>
    <span class="otext" style="color:var(--g-dim);font-style:italic">${T("autojump")}</span>
    <button class="jump" data-j="-1">→ ${n.jump}</button></div>`:"";
  $("body").innerHTML=`<div class="npc" contenteditable="plaintext-only" data-ph="${T('ph_npc')}">${esc(n.npc)}</div>`+
    n.opts.map((o,i)=>{const bad=o.to&&!isReal(o.to)&&!isRsv(o.to);
      return `<div class="optrow"><button class="kebab" data-k="${i}" title="${T('tip_more')}">⋮</button>
        <img class="ico" src="${icoFor(o)}" alt="">
        <span class="otext" contenteditable="plaintext-only" data-o="${i}" data-ph="${T('ph_opt')}">${esc(o.t)}</span>
        ${o.act?`<span class="chip">${o.act.kind} ${shortQ(o.act.q)}</span>`:""}
        ${o.setst?`<span class="chip s">setstatus ${shortQ(o.setst.q)}</span>`:""}
        ${o.standing?`<span class="chip s">${T("standing")} ${o.standing.d>0?"+":""}${o.standing.d}</span>`:""}
        ${o.gate?`<span class="chip g">${o.gate.kind==="if"?T("only_if"):T("unless")} ${o.gate.s.map(x=>shortStatus()[x]).join("/")}</span>`:""}
        ${o.once?`<span class="chip g">${T("once")}</span>`:""}${o.always?`<span class="chip g">always</span>`:""}
        <button class="jump${bad?" bad":o.to?"":" end"}" data-j="${i}">→ ${o.to||T("end_dlg")}</button>
        <button class="del" data-d="${i}">✕</button></div>`;}).join("")+jumpRow+
    `<button class="addopt" id="addOpt">${T("add_opt")}</button>`;
  $("body").querySelector(".npc").oninput=e=>{n.npc=e.target.textContent;soft();};
  $("body").querySelectorAll(".otext[data-o]").forEach(el=>el.oninput=()=>{n.opts[+el.dataset.o].t=el.textContent;soft();});
  $("body").querySelectorAll(".kebab").forEach(b=>b.onclick=e=>optMenu(e,+b.dataset.k));
  $("body").querySelectorAll(".jump").forEach(b=>b.onclick=e=>jumpMenu(e,+b.dataset.j));
  $("body").querySelectorAll(".del").forEach(b=>b.onclick=()=>{n.opts.splice(+b.dataset.d,1);refresh();});
  if($("addOpt"))$("addOpt").onclick=()=>{n.opts.push({t:T("new_opt"),to:null});refresh();};}
function drawBeats(){const n=N();
  $("beatbar").innerHTML=n.narr.map((_,i)=>`<button class="beat" data-b="${i}">${T("tip_narr")} ${i+1}</button>`).join("")
    +`<button class="beat" data-b="${n.narr.length}">${T("tip_talk")}</button>`
    +`<button class="beat" id="addBeat" title="${T('tip_addbeat')}">＋</button>`
    +`<button class="audchip" id="voiceChip" title="${T('tip_voice')}"></button>`;
  $("beatbar").querySelectorAll(".beat[data-b]").forEach(b=>{
    b.setAttribute("aria-current",+b.dataset.b===beat);
    b.onclick=()=>{beat=+b.dataset.b;drawStage();};});
  $("addBeat").onclick=()=>{n.narr.push({text:"",bg:""});beat=n.narr.length-1;drawStage();};
  drawAudioChips();}

/* ══ 音频 ══
   BGM 是节点级的：插件把它挂在节点的第一行上（有旁白挂 #nar0，否则挂 #npc），
   而且只在文件名变化时才重启 —— 相邻节点填同一个文件，BGM 就是连续的。
   语音是每拍的：旁白第 i 拍 → narr[i].audio，台词那拍 → 节点的 npcAudio。 */
function curAudio(){const n=N();return isTalk()?n.audio:n.narr[beat]?.audio;}
function setAudio(v){const n=N();if(isTalk())n.audio=v||undefined;else n.narr[beat].audio=v||undefined;
  drawAudioChips();soft();}
function drawAudioChips(){
  const n=N(),bgm=$("bgmChip"),va=$("voiceChip");
  if(bgm){bgm.textContent=(n.bgm?"♪ "+n.bgm:"♪ "+T("bgm_none"));bgm.classList.toggle("on",!!n.bgm);

function fit(){const ns=Object.values(doc.nodes);if(!ns.length||!$("graph"))return;

  const maxx=Math.max(...ns.map(n=>n.x+NW)),maxy=Math.max(...ns.map(n=>n.y+130));

   文件照样能打开、照样不报错，进游戏才发现不对。这里逐行扫一遍，把要动的地方摆出来。

   每一条都是对着两边的解析器核过的（老的在 VisitAPI Framework\Client\Dialog\DialogScriptParser.cs）：
   凡是"新解析器读不出来"或"读出来但意思变了"的，才进这张表。 */
/* 藏身处触发器那条是**软**的：4.0.13 和 4.1 的写法一模一样，光看这一行分不出来
   （老的是相对区域的偏移，新的是世界坐标）。所以它只在"这份文件已经确定是旧版"时才提——
   否则每份 4.1 的剧本都会被冤枉一次，那种狼来了的提示没人会看第二遍。 */
const COMPAT_SOFT=["hideout_offset"];
function compatScan(text){
  const out=[],lines=text.replace(/\r\n/g,"\n").split("\n");
  let inNode=false,plain=0,plainAt=0;
  const add=(ln,raw,k)=>out.push({ln,raw:raw.trim(),k});
  lines.forEach((raw,idx)=>{
    const ln=idx+1,line=raw.trim();
    if(!line||line[0]==="#"||line.startsWith("//"))return;
    if(/^<[\w.\-]+>/.test(line)){inNode=true;plain=0;return;}
    if(!inNode){
      /* 老写法两种顺序都认，新的只认 id 在前 —— 名字在前会把 "名字" 当成商人 id */
      const tr=/^trader\s*:\s*(.*)$/i.exec(line);
      if(tr&&/^"/.test(tr[1].trim()))add(ln,line,"trader_order");
      /* 老的支持 tab: always，新的只认 tab: if …，写 always 会被静默丢掉 */
      const tb=/^tab\s*:\s*(.*)$/i.exec(line);
      if(tb&&!/^if\s/i.test(tb[1].trim()))add(ln,line,"tab_always");
      if(/^trigger\s*:/i.test(line)){
        /* 藏身处触发器：老版那三个数是**相对区域的偏移**，新版是**世界坐标**。
           数字一样、位置完全不同，而且两边都不会报错——这条最容易翻车 */
        if(/^trigger\s*:\s*hideout\b/i.test(line)&&/\([^)]*\)/.test(line))add(ln,line,"hideout_offset");
        if(/\boffset\b/i.test(line))add(ln,line,"trig_offset");
      }

    }
    /* 节点体：老版一个节点可以写好几行商人台词（会拼起来），新版**只留最后一行** */
    if(line.startsWith(">")||line.startsWith("- ")||line.startsWith("->")){plain=0;return;}
    plain++; if(plain===1)plainAt=ln;
    if(plain===2)add(plainAt,lines[plainAt-1],"npc_multiline");
  });
  /* 分隔符：老版按 `|` 和 `,` 字符切，新版认的是前后带空格的 " | "。
     ⚠️ 不能见到竖线就报 —— 台词里本来就可能有「要么A|要么B」这种写法，
     那不是分隔符，报出来就是冤枉。所以只认**竖线后面紧跟着一个已知指令**的情况。 */
  const DIRECTIVE=/\|\s*(accept|complete|handover|setstatus|standing|if|ifnot|once|always|bg|anim|bgm|audio)\b/;
  lines.forEach((raw,idx)=>{
    const line=raw.trim();
    if(!line||line[0]==="#"||line.startsWith("//"))return;
    if(DIRECTIVE.test(line)&&!/\s\|\s/.test(line))add(idx+1,line,"pipe_space");
    if(/^-\s/.test(line)&&/->/.test(line)&&!/\s->\s/.test(line))add(idx+1,line,"arrow_space");
  });
  /* 一条"硬"证据都没有＝这就是份 4.1 的剧本，软提示一律不提 */
  const hard=out.some(c=>!COMPAT_SOFT.includes(c.k));
  return (hard?out:out.filter(c=>!COMPAT_SOFT.includes(c.k))).sort((a,b)=>a.ln-b.ln);
}
let COMPAT=[];
function compatPane(el){
  const rows=COMPAT.map(c=>`<div class="cprow"><b>${T("cp_"+c.k)}</b>
    <div class="cpline">${c.ln}: ${esc(c.raw.slice(0,70))}${c.raw.length>70?"…":""}</div>
    <span>${T("cp_"+c.k+"_fix")}</span></div>`).join("");
  placeAt(el,`<h4>${TF("cp_title",COMPAT.length)}</h4>
    <div class="hint" style="margin-bottom:.5rem">${T("cp_note")}</div>${rows}`);
}

/* ══ 触发点（文件头的 trigger: 行）══
   玩家走到哪、看着哪儿按一下，就打开这段对话。任务编辑器那边只能看不能改
   （它改的是任务，不是剧本），所以入口只能在这里。

   **只重写被改过的那一行**，别的原文照抄：坐标是作者手填的，重新格式化会把
   `0.09` 印成 `0.090000003576`，数值没变但文件被改花了（见 DialogTrigger.Raw 的注释）。
   所以这里全程按字符串处理，不 parseFloat。 */
const TRIG_RE=/^\s*(\S+)\s+(\S+)\s*\(([^)]*)\)\s*(.*)$/;
function trigParse(line){
  const m=TRIG_RE.exec(line||""); if(!m)return null;
  const xyz=m[3].split(",").map(s=>s.trim());
  const t={kind:m[1].toLowerCase(),place:m[2],x:xyz[0]||"0",y:xyz[1]||"0",z:xyz[2]||"0",
           node:"",dist:"",radius:"",free:false,gate:"",prompt:""};
  let rest=m[4];
  const q=rest.match(/"([^"]*)"/); if(q){t.prompt=q[1];rest=rest.replace(q[0],"");}
  const tok=rest.split(/\s+/).filter(Boolean);
  for(let i=0;i<tok.length;i++){
    const k=tok[i].toLowerCase();
    if(k==="dist")t.dist=tok[++i]||"";
    else if(k==="radius")t.radius=tok[++i]||"";
    else if(k==="hit"){t.radius=tok[++i]||"";t.free=true;}   /* hit = 半径 + free 的简写 */
    else if(k==="node")t.node=tok[++i]||"";
    else if(k==="if")t.gate=tok[++i]||"";
    else if(k==="free"||k==="door")t.free=true;
  }
  return t;
}
/* 生成的顺序照 C# 的 DialogWriter.Trigger 来，两边看起来才是一份东西 */
const trigLine=t=>[t.kind,t.place||"*",`(${t.x}, ${t.y}, ${t.z})`,
  t.node?"node "+t.node:"", t.dist?"dist "+t.dist:"", t.radius?"radius "+t.radius:"",
  t.free?"free":"", t.gate?"if "+t.gate:"", t.prompt?`"${t.prompt}"`:""].filter(Boolean).join(" ");
const trigDesc=l=>{const t=trigParse(l);
  return t?`${t.kind} ${t.place}${t.node?" → <"+t.node+">":""}`:l;};

function trigMenu(el){
  const rows=doc.triggers.map((l,i)=>
    `<button class="trrow" data-t="${i}"><b>${esc(trigDesc(l))}</b><span>${i+1}</span></button>`).join("");
  const p=placeAt(el,`<h4>${T("m_trig")}</h4>
    ${rows||`<div class="hint">${T("m_trig_none")}</div>`}
    <div class="opts2" style="margin-top:.5rem"><button data-new>${T("m_trig_new")}</button></div>
    <div class="hint">${T("m_trig_d")}</div>`);
  p.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>trigEdit(el,+b.dataset.t));
  p.querySelector("[data-new]").onclick=()=>{
    /* 新的一条先给能跑的默认值：类型 hideout、坐标 0，其余留空让作者填 */
    doc.triggers.push(trigLine({kind:"hideout",place:"IntelligenceCenter",x:"0",y:"0",z:"0",
      node:doc.start,dist:"3",prompt:""}));
    doc.headRaw.push({k:"trigger",i:doc.triggers.length-1});
    markDirty(true);trigEdit(el,doc.triggers.length-1);};
}
function trigEdit(el,i){
  const t=trigParse(doc.triggers[i])||{kind:"hideout",place:"",x:"0",y:"0",z:"0",
    node:"",dist:"",radius:"",free:false,gate:"",prompt:""};
  const fld=(k,key,ph)=>`<label class="fld"><i>${T(key)}</i>
    <input data-f="${k}" value="${esc(t[k]??"")}" placeholder="${esc(ph||"")}"></label>`;
  const p=placeAt(el,`<h4>${TF("m_trig_one",i+1)}</h4>
    <div class="opts2">${["hideout","raid"].map(k=>
      `<button data-k="${k}" aria-pressed="${t.kind===k}">${k}</button>`).join("")}</div>
    ${fld("place","m_tr_place","IntelligenceCenter")}
    <div class="trxyz">${["x","y","z"].map(a=>
      `<label class="fld"><i>${a}</i><input data-f="${a}" value="${esc(t[a])}"></label>`).join("")}</div>
    <label class="fld"><i>${T("m_tr_node")}</i><select data-f="node">
      <option value="">${T("m_tr_node_no")}</option>
      ${Object.keys(doc.nodes).map(n=>
        `<option value="${esc(n)}"${n===t.node?" selected":""}>${esc(n)}</option>`).join("")}
    </select></label>
    ${fld("dist","m_tr_dist","3")}
    ${fld("radius","m_tr_radius","1.2")}
    <div class="opts2"><button data-free aria-pressed="${!!t.free}">${T("m_tr_free")}</button></div>
    ${fld("gate","m_tr_gate","5043a1ce…=Started")}
    ${fld("prompt","m_tr_prompt",T("m_tr_prompt_ph"))}
    <div class="hint">${T("m_tr_d")}</div>
    <div class="opts2" style="margin-top:.5rem">
      <button data-del>${T("m_trig_del")}</button><button data-back>${T("m_trig_back")}</button></div>`);
  const put=()=>{
    p.querySelectorAll("[data-f]").forEach(el=>t[el.dataset.f]=el.value.trim());
    doc.triggers[i]=trigLine(t);markDirty(true);refresh();render();};
  p.querySelectorAll("[data-f]").forEach(el=>{
    el.onchange=put;
    el.onkeydown=ev=>{if(ev.key==="Enter"){put();hide();}};});
  p.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{t.kind=b.dataset.k;put();trigEdit(el,i);});
  p.querySelector("[data-free]").onclick=()=>{t.free=!t.free;put();trigEdit(el,i);};
  p.querySelector("[data-back]").onclick=()=>trigMenu(el);
  p.querySelector("[data-del]").onclick=async()=>{
    if(!await confirm2(T("m_trig_delask")))return;
    doc.triggers.splice(i,1);
    /* 头行里记的是"第几条触发器"，删一条后面的下标要跟着往前挪，不然回写会串行 */
    doc.headRaw=doc.headRaw.filter(h=>!(h.k==="trigger"&&h.i===i));
    doc.headRaw.forEach(h=>{if(h.k==="trigger"&&h.i>i)h.i--;});
    markDirty(true);refresh();render();hide();};
}

/* ══ 节点的身份：入口 / 初见 / 分层入口 ══
   这几样其实是文件头那几行在"指"某个节点。图上早就按身份涂了色
   （黄=start 橙=其它入口 青=触发点），但一直**看得见改不了**——只能回去手写文件头。
   现在每个节点标题上多一个 ⋮。 */
const condText=w=>(w.conds||[]).map(c=>c.f+(c.le?"<=":">=")+c.v).join(" ");
/* 文件头里没有这一行的话补一条记录，不然 DialogWriter 不知道该在哪儿吐 */
function ensureHead(k){
  if(doc.headRaw.some(h=>h.k===k))return;
  const i=doc.headRaw.findIndex(h=>h.k==="start");
  doc.headRaw.splice(i<0?doc.headRaw.length:i+1,0,{k,i:0});
}
function roleMenu(el,name){
  const mine=doc.when.map((w,i)=>({w,i})).filter(x=>x.w.node===name);
  const p=placeAt(el,`<h4>${TF("m_role",name)}</h4>
    <div class="kindmenu col">
      <button data-r="start" aria-pressed="${doc.start===name}">${T("m_role_start")}</button>
      <button data-r="first" aria-pressed="${doc.first===name}">${T("m_role_first")}</button>
      <button data-r="when">${T("m_role_when")}</button>
    </div>
    ${mine.length?`<h4>${T("m_role_whens")}</h4>`+mine.map(x=>
      `<button class="trrow" data-w="${x.i}"><b>${esc(condText(x.w))}</b><span>✕</span></button>`).join(""):""}
    <div class="hint">${T("m_role_d")}</div>`);
  const done=()=>{markDirty(true);refresh();render();};
  p.querySelector('[data-r="start"]').onclick=()=>{doc.start=name;ensureHead("start");done();hide();};
  p.querySelector('[data-r="first"]').onclick=()=>{
    doc.first=doc.first===name?null:name; if(doc.first)ensureHead("first"); done();hide();};
  p.querySelector('[data-r="when"]').onclick=async()=>{
    const v=await ask(T("m_role_ask"),"level>=4");
    if(!v)return;
    /* 和解析器认的是同一套写法，认不出来就直说，别写一条进去然后神秘失效 */
    const conds=[...v.matchAll(/(level|standing)\s*(>=|<=)\s*([-+\d.]+)/g)]
      .map(m=>({f:m[1],le:m[2]==="<=",v:parseFloat(m[3])}));
    if(!conds.length){await say(T("m_role_bad"));return;}
    doc.when.push({node:name,conds});
    doc.headRaw.push({k:"when",i:doc.when.length-1});
    done();hide();};
  p.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.w;
    doc.when.splice(i,1);
    /* 头行记的是"第几条 when"，删一条后面的下标要往前挪，不然回写会串行 */
    doc.headRaw=doc.headRaw.filter(h=>!(h.k==="when"&&h.i===i));
    doc.headRaw.forEach(h=>{if(h.k==="when"&&h.i>i)h.i--;});
    done();hide();});
}

/* ══ tab: 商人界面上那个「对话」按钮出不出现 ══
   不写这一行＝一直显示；写了就只在某个任务处于某些状态时才显示。 */
function tabMenu(el){
  const on=!!doc.tab;
  const p=placeAt(el,`<h4>${T("m_tab")}</h4>
    <div class="opts2">
      <button data-t="0" aria-pressed="${!on}">${T("m_tab_off")}</button>
      <button data-t="1" aria-pressed="${on}">${T("m_tab_on")}</button></div>
    ${on?`<label class="fld" style="margin-top:.5rem"><i>${T("m_tab_q")}</i>
      <input id="tabQ" value="${esc(doc.tab||"")}" placeholder="5043a1ce90726f6a536f7286"></label>
      <h4>${T("m_tab_st")}</h4>
      <div class="opts2">${shortStatus().map((s,i)=>
        `<button data-s="${i}" aria-pressed="${(doc.tabS||[]).includes(i)}">${s}</button>`).join("")}</div>`:""}
    <div class="hint">${T("m_tab_d")}</div>`);
  const done=()=>{markDirty(true);render();};
  p.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(b.dataset.t==="1"){doc.tab=doc.tab||T("pick_q");doc.tabS=doc.tabS?.length?doc.tabS:[4];ensureHead("tab");}
    else {doc.tab=null;doc.tabS=[];}
    done();tabMenu(el);});
  const q=$("tabQ");
  if(q){q.onchange=()=>{doc.tab=q.value.trim()||null;done();};
        q.onkeydown=e=>{if(e.key==="Enter"){doc.tab=q.value.trim()||null;done();hide();}};}
  p.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.s,L=(doc.tabS ??= []);
    const at=L.indexOf(i); if(at<0)L.push(i); else L.splice(at,1);
    L.sort((a,b)=>a-b); done();tabMenu(el);});
}

/* 清空＝那一行不写了（DialogWriter 见到 null 就跳过这条头行）。
   文件里本来没有这一行的话，补一条记录插在 start 后面，不然写手不知道该在哪儿吐。 */
function setHead(k,v){
  doc[k]=v||null;
  if(!v||doc.headRaw.some(h=>h.k===k))return;
  const i=doc.headRaw.findIndex(h=>h.k==="start");
  doc.headRaw.splice(i<0?doc.headRaw.length:i+1,0,{k,i:0});
}
/* place() 读的是事件里的 currentTarget —— 那个东西**只在事件派发期间有效**，
   异步之后（或者从别的回调里）再拿就是 null，place 会当场抛错：
   innerHTML 已经塞进去了、后面的接线全没跑，于是面板看着正常，按钮一个都不动。
   触发点面板要在"列表 ↔ 表单"之间来回切，所以自己攥着元素，不攥事件。 */
const placeAt=(el,html)=>place({currentTarget:el},html);

/* ══ 程序内的弹窗 ══
   浏览器自带的 prompt / confirm / alert 长着系统的样子，跟这套界面完全不搭，
   而且 prompt 在某些浏览器里能被用户永久关掉——那样"新建文件"就直接没法用了。
   自己做一个：三种形态共用一个壳，都返回 Promise。
   ok(确定) / cancel(取消) 的 id 固定，自动化测试靠它点。 */
function modal({title,msg,input,noCancel,danger}){
  return new Promise(res=>{
    const w=document.createElement("div");w.className="mdwrap";
    w.innerHTML=`<div class="mdbox">
      <div class="mdhead"><span class="slab"></span>${esc(title||T("md_title"))}</div>
      <div class="mdbody">${msg||""}</div>
      ${input!==undefined?`<input id="mdIn" class="mdin" value="${esc(input)}">`:""}
      <div class="mdacts">
        ${noCancel?"":`<button class="btn ghost" id="mdCancel"><span>${T("md_cancel")}</span></button>`}
        <button class="btn ${danger?"warn":"pri"}" id="mdOk"><span>${T("md_ok")}</span></button>
      </div></div>`;
    document.body.appendChild(w);
    const done=v=>{w.remove();document.removeEventListener("keydown",key,true);res(v);};
    const okv=()=>input!==undefined?$("mdIn").value:true;
    const key=e=>{
      if(e.key==="Escape"){e.stopPropagation();done(noCancel?true:null);}
      if(e.key==="Enter"&&input!==undefined){e.preventDefault();done(okv());}};
    document.addEventListener("keydown",key,true);
    $("mdOk").onclick=()=>done(okv());
    const c=$("mdCancel"); if(c)c.onclick=()=>done(null);
    /* 点框外＝取消，和点「取消」一个意思；框里点不到就别响应 */
    w.onmousedown=e=>{if(e.target===w)done(noCancel?true:null);};
    const i=$("mdIn"); if(i){i.focus();i.select();}
  });
}
/* ══ 新手引导 ══
   第一次用的人面对满屏格子和角标，不知道哪些能点。这里按步骤把元素一个个挖出来照亮，
   旁边浮一句话说它是干什么的。对话页和任务页各一条线。

   规则：
   - **只照亮真实存在的元素**。目标不在页面上（比如任务页还没载入完）就跳过这一步，
     绝不画一个指向空气的框——那比不引导更糟
   - 随时能退出，退出后不再自动弹（记在 localStorage）
   - 不接管点击：高亮只是"看"，用户想点什么还是点什么 */
const TOUR={
  dlg:[["#openBtn","tr_open"],[".cart [data-head]","tr_head"],[".cart [data-trig]","tr_trig"],
       [".cart [data-tab]","tr_tab"],["#viewport .gamebox","tr_stage"],[".beatbar","tr_beat"],
       ["#addNode","tr_add"],[".gnode .grole","tr_role"],["#bars","tr_bars"],["#srcBtn","tr_src"],
       ["#saveBtn","tr_save"]],
  quest:[["[data-pane]","tr_q_pane"],["#qNew","tr_q_new"],[".tbrief .plate","tr_q_img"],
         ['[data-add="obj"]',"tr_q_obj"],['[data-menu="obj"]',"tr_q_dots"],["#qgraph","tr_q_graph"],
         [".mailpane","tr_q_mail"],["#qSave","tr_q_save"]],
};
const TOUR_KEY="visitapi.tour.";
let tourStep=-1,tourList=[],tourKind="";
function tourStart(kind){
  tourKind=kind;
  /* 目标不在就整步跳过：宁可少讲一句，也不能指着空气讲 */
  tourList=TOUR[kind].filter(([sel])=>document.querySelector(sel));
  if(!tourList.length)return;
  tourStep=0;tourDraw();
}
function tourEnd(remember){
  tourStep=-1;
  document.querySelectorAll(".tourwrap").forEach(e=>e.remove());
  /* 两边都写：正本是 pref（活过重启和换端口）；localStorage 只是同一次会话里的顺手镜像，
     测试探针靠它压住/检查引导，不用改一票探针。 */
  if(remember){setPref("tour."+tourKind,"1");try{localStorage.setItem(TOUR_KEY+tourKind,"1");}catch(_){}}
}
function tourDraw(){
  document.querySelectorAll(".tourwrap").forEach(e=>e.remove());
  if(tourStep<0||tourStep>=tourList.length)return tourEnd(true);
  const [sel,key]=tourList[tourStep];
  const el=document.querySelector(sel);
  if(!el){tourStep++;return tourDraw();}
  el.scrollIntoView({block:"nearest",inline:"nearest"});
  const r=el.getBoundingClientRect(),pad=6;
  const w=document.createElement("div");w.className="tourwrap";
  const last=tourStep===tourList.length-1;
  w.innerHTML=`<div class="tourhole" style="left:${r.left-pad}px;top:${r.top-pad}px;
      width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
    <div class="tourtip" id="tourTip"><b>${T(key)}</b><span>${T(key+"_d")}</span>
      <div class="touracts">
        <i>${tourStep+1} / ${tourList.length}</i>
        <button class="btn ghost" id="tourSkip"><span>${T("tr_skip")}</span></button>
        <button class="btn pri" id="tourNext"><span>${T(last?"tr_done":"tr_next")}</span></button>
      </div></div>`;
  document.body.appendChild(w);
  /* 气泡贴着目标放，放不下就翻到另一边；两边都放不下就贴屏幕边 */
  const tip=$("tourTip"),tw=tip.offsetWidth,th=tip.offsetHeight,m=12;
  let x=r.left,y=r.bottom+pad+8;
  if(y+th>innerHeight-m)y=Math.max(m,r.top-pad-8-th);
  tip.style.left=Math.max(m,Math.min(x,innerWidth-tw-m))+"px";
  tip.style.top=y+"px";
  $("tourNext").onclick=()=>{tourStep++;tourDraw();};
  $("tourSkip").onclick=()=>tourEnd(true);
}
/* 窗口一变，洞就对不上了——高亮框会飘到边上，指着一块空地。重画一次就好 */
addEventListener("resize",()=>{if(tourStep>=0)tourDraw();});
/* 进某一页时，如果这条线还没走过，就自动开一次 */
function tourMaybe(kind){
  if(tourStep>=0)return;
  if(pref("tour."+kind))return;                            /* 正本：活过重启换端口 */
  try{ if(localStorage.getItem(TOUR_KEY+kind))return; }catch(_){}   /* 探针压引导用的口子 */
  setTimeout(()=>{if(page===(kind==="dlg"?"dlg":"quest"))tourStart(kind);},600);
}

const ask=(msg,def,title)=>modal({title,msg:esc(msg),input:def??""});
const say=(msg,title)=>modal({title,msg:esc(msg),noCancel:true});
const confirm2=(msg,title)=>modal({title,msg:esc(msg),danger:true}).then(v=>v===true);
function hide(){$("pop").classList.remove("on");}
addEventListener("mousedown",e=>{if(!$("pop").contains(e.target)&&!e.target.closest(".kebab,.jump,.bglayer"))hide();});

function soft(){drawGraph();stat();}
function refresh(){if(!$("gnodes"))return;                 /* 不在对话页时什么都别画 */
  drawStage();drawGraph();stat();drawBars();drawRail();telem();
  const fm=$("fmeta");
  if(fm)fm.textContent=Object.keys(doc.nodes).length;
  autosave();}

/* ══ 保存 ══
   现在有自己的本地服务端了，直接 POST 写回原文件——原型时代那套
   「下载 + 剪贴板 + 让你手动复制」是被沙箱 iframe 逼出来的，已全部删除。
   服务端覆盖前会自动留一份 .bak。 */
let saveTip=null;
function note(msg,cls){const e=$("saved");if(!e)return;
  e.textContent=msg;e.className="saved "+(cls||"");
  clearTimeout(saveTip);if(cls==="hot")saveTip=setTimeout(()=>markDirty(dirty),2400);}
function markDirty(v){
  dirty=v;
  const e=$("saved");if(!e)return;
  e.textContent=v?T("unsaved"):(filePath?T("saved_ok"):"");
  e.className="saved "+(v?"dirty":"");}
function autosave(){markDirty(docSnap()!==savedText);}   /* 只和上次载入/保存时的模型快照比对 */
/* 源码由服务端渲染：看到的就是按下保存会写进文件的那份文本，不会有"预览和实存不一样"这种事 */
function openSrc(sel){
  $("srcNote").textContent=`${T("src_gen")} · ${doc.warn.length?doc.warn.length+" "+T("src_warn"):T("src_nowarn")}`;
  $("srcwrap").classList.add("on");
  $("srcPre").value="…";
  api("/api/dlg/render",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(docJson())})
    .then(d=>{$("srcPre").value=d.text;
      if(sel){const t=$("srcPre");t.readOnly=false;t.focus();t.select();t.readOnly=true;}})
    .catch(e=>{$("srcPre").value=String(e.message);});}
async function saveDlg(){
  if(!filePath){note(T("save_nofile"),"dirty");return;}
  /* .dlg.demo 是插件带的示例，游戏只读 *.dlg —— 存回 .demo 等于白改，这里拦一下 */
  if(/\.dlg\.demo$/i.test(filePath)){
    const real=filePath.replace(/\.demo$/i,"");
    if(!await confirm2(T("demo_save").replace("{0}",real)))return;
    filePath=real; const fp=$("fpath"); if(fp)fp.textContent=real;
  }
  const snap=docSnap();
  api("/api/dlg?path="+encodeURIComponent(filePath),
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(docJson())})
    .then(()=>{savedText=snap;markDirty(false);note(T("saved_ok"),"hot");})
    .catch(e=>note(T("save_fail")+" "+e.message,"dirty"));}
/* 离开页面前拦一下——没有草稿兜底了，改了不存就是真丢 */
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
function render(){
  drawNav();const m=$("main");
  if(page==="dlg"){m.innerHTML=dlgPage();
    $("bglayer").onclick=e=>bgMenu(e);
    $("srcBtn").onclick=()=>openSrc(false);
    document.querySelectorAll("[data-head]").forEach(b=>b.onclick=headMenu);
    document.querySelectorAll("[data-trig]").forEach(b=>b.onclick=e=>trigMenu(e.currentTarget));
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=e=>tabMenu(e.currentTarget));
    document.querySelectorAll("[data-compat]").forEach(b=>b.onclick=e=>compatPane(e.currentTarget));
    $("saveBtn").onclick=saveDlg;
    $("openBtn").onclick=openPicker;
    $("vfold").onclick=()=>{
      const w=document.querySelector(".work");w.classList.toggle("folded");
      relaid=false;setTimeout(relayout,20);};       /* 宽度变了就按新长宽比重排一次 */
    /* 上次拖到的预览宽度重放回去（按当前窗口重新钳一遍，免得小窗上重放大窗的值） */
    if(splitW)$("viewport").style.flexBasis=Math.max(280,Math.min($("main").clientWidth-260,splitW))+"px";
    wireGraph();wireSplit();refresh();setTimeout(relayout,30);

       不提示的话用户会以为看到的就是自己的文件（我自己先掉进去过） */

  }else if(page==="cloth"){m.innerHTML=botPage();wireBot();

        <div class="rule"></div></div>

function abLoad(){

    .then(r=>ABENV={ws:r[0]||{},q:r[1]||{}})

function aboutPage(){

function abQuick(ws,q){

function abHero(ws,q){

function abModules(){

function wireAbout(){

    b.onclick=()=>{ABENV=null;page=b.dataset.go;render();});

     「去设置」在快速上手和环境卡里各有一个，所以按属性收，不用 id。 */
  document.querySelectorAll("#main [data-ws]").forEach(b=>

/* ══ 使用说明页 ══
   写给不写代码的人看：一张卡讲一件事，先说"是什么"再说"怎么写"，每条规则尽量配一段真能跑的例子。
   用原生 <details> 做折叠——不用自己写状态，键盘和读屏软件也天然能用。
   两栏：左边对话、右边任务。这一页全是字，单栏在宽屏上会拉出很长的行，读着累。 */

/* ══ 设置页 ══ */
/* ══ 工程（.vaproj）══
   三个根打包成一份键=值小文件，一键切换。切换是在满载状态下发生的——
   四处"没保存"（dirty/qdirty/bdirty/adirty）都要拦，切完把挂在旧根上的缓存一个不留。 */
let PJ=null,pjWait=false;
function pjLoad(){
  if(PJ||pjWait)return;pjWait=true;
  api("/api/project").then(d=>{PJ=d;}).catch(()=>{PJ={current:{},recent:[]};})
    .then(()=>{pjWait=false;if(page==="set")render();});
}
function pjCard(){
  const cur=(PJ&&PJ.current)||{},rec=(PJ&&PJ.recent)||[];
  const path=p=>esc(p||T("ws_unset"));
  return `<div class="card"><div class="chead">PROJECT<span>REF.P003</span></div>
    <div class="row"><div class="lbl"><b>${T("pj_cur")}</b>
      <span>${path(cur.root)}<br>${path(cur.quests)}<br>${path(cur.mods)}</span></div>
      <button class="btn ghost" id="pjSave"><span>${T("pj_save")}</span></button></div>
    ${rec.map((r,i)=>`<div class="row"><div class="lbl"><b>${esc(r.name)}</b>
        <span>${esc(r.path)}${r.ok?"":" · "+T("pj_gone")}</span></div>
      ${r.ok?`<button class="btn ghost" data-pj="${i}"><span>${T("pj_go")}</span></button>`:""}</div>`).join("")
      ||`<div class="row"><div class="lbl"><span>${T("pj_none")}</span></div></div>`}
    <div class="row"><div class="lbl"><b>${T("pj_open")}</b><span>${T("pj_open_d")}</span></div>
      <button class="btn ghost" id="pjGo"><span>${T("pj_go")}</span></button></div>
  </div>`;
}
async function pjOpen(path){
  /* qdirty/bdirty/adirty 住在后加载的页脚本里，typeof 兜一手：万一哪个文件没起来，守卫别跟着炸 */
  const busy=dirty||(typeof qdirty==="function"&&qdirty())
    ||(typeof bdirty==="function"&&bdirty())||(typeof adirty==="function"&&adirty());
  if(busy&&!await confirm2(T("pj_dirty")))return;
  api("/api/project/open",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path})})
    .then(d=>{pjApply();say(TF("pj_done",d.name||""));})
    .catch(e=>say(TF("pj_fail",String(e.message).slice(0,120))));
}
function pjApply(){
  /* 换工程=三根齐换：挂在旧根上的缓存一个不留（QL 是挂接缓存，单换任务库时漏清过一次）。
     对话页打开的文件路径已越界，退回起手模板；素材清单和工作区横幅重新拉。 */
  QD=null;QROOTS=null;QL=null;BD=null;AD=null;ATPL={};ABENV=null;PJ=null;
  filePath=null;doc=parseDlg(srcText());cur=doc.start;beat=0;picked=false;
  applyStatic();savedText=docSnap();markDirty(false);
  api("/api/workspace").then(w=>{WS=w;showWs();}).catch(()=>{});
  api("/api/assets").then(a=>{ASSETS={bg:a.bg||[],audio:a.audio||[]};}).catch(()=>{});
  render();
}

function setPage(){
  pjLoad();
  const seg=(id,items,cur)=>`<div class="seg" id="${id}">`+items.map(it=>
    `<button data-v="${it.v}" aria-pressed="${cur===it.v}">${it.t}</button>`).join("")+`</div>`;
  return `<div class="setwrap">
    <div class="secline"><div class="slab"></div>
      <div><h1>${T("set_title")}</h1><div class="lede">${T("set_lede")}</div></div>
      <div class="rule"></div></div>

    <div class="card"><div class="chead">APPEARANCE<span>DEVICE TYPE.A001 · IPX3</span></div>
      <div class="row"><div class="lbl"><b>${T("set_theme")}</b><span>${T("set_theme_d")}</span></div>
        ${seg("segTheme",[{v:"dark",t:T("set_dark")},{v:"light",t:T("set_light")}],theme)}</div>
      <div class="row"><div class="lbl"><b>${T("set_cur")}</b><span>${T("set_cur_d")}</span></div>
        ${seg("segCur",[{v:"on",t:T("set_cur_on")},{v:"off",t:T("set_cur_off")}],curOn?"on":"off")}</div>
    </div>

    <div class="card alt"><div class="chead">LOCALE<span>DEVICE TYPE.L002 · IPX3</span></div>
      <div class="row"><div class="lbl"><b>${T("set_lang_t")}</b><span>${T("set_lang_d")}</span></div>
        ${seg("segLang",[{v:"zh",t:"中文"},{v:"en",t:"English"}],lang)}</div>
    </div>

    ${pjCard()}

    <div class="card note"><div class="chead">NOTE<span>REF.N000</span></div><div class="row"><div class="lbl">
      <b>${T("set_note_t")}</b><span>${T("set_note_d")}</span></div></div></div>
  </div>`;}
function wireSettings(){
  $("segTheme").querySelectorAll("button").forEach(b=>b.onclick=()=>{setTheme(b.dataset.v);render();});
  $("segCur").querySelectorAll("button").forEach(b=>b.onclick=()=>{setCur(b.dataset.v==="on");render();});
  $("segLang").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    lang=b.dataset.v;setPref("lang",lang);
    document.documentElement.lang=lang==="zh"?"zh-CN":"en";
    /* 还没打开过任何文件、也没动过手 → 起手模板重新按新语言生成。
       打开过文件就绝不动：那是人家的剧本，不能因为切了个界面语言就被换掉。 */
    if(!filePath&&!dirty)doc=parseDlg(srcText());
    applyStatic();render();savedText=docSnap();markDirty(false);});
  const ps=$("pjSave"); if(ps)ps.onclick=async()=>{
    const def=((PJ&&PJ.eft)?PJ.eft+"\\":"")+(lang==="zh"?"我的工程":"my-project")+".vaproj";

/* ══ 源码窗：拖动 + 缩放，位置大小记住 ══ */
(function srcWindow(){
  const w=$("srcwrap");
  try{const s=JSON.parse(pref("srcwin")||"null");
    if(s){w.style.left=s.x+"px";w.style.top=s.y+"px";w.style.width=s.w+"px";w.style.height=s.h+"px";}}catch(_){}
  const save=()=>{try{const r=w.getBoundingClientRect();
    setPref("srcwin",JSON.stringify({x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height)}));}catch(_){}};
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  /* 拖动期间给 <html> 打 data-drag，把全屏指针锁住 —— 理由同 quest.js 的 qdrag */
  const grab=(e,move,kind)=>{e.preventDefault();
    document.documentElement.dataset.drag=kind||"move";
    const up=()=>{removeEventListener("mousemove",move);removeEventListener("mouseup",up);
      delete document.documentElement.dataset.drag;save();};
    addEventListener("mousemove",move);addEventListener("mouseup",up);};
  $("srcHead").onmousedown=e=>{
    if(e.target.closest("button"))return;                     /* 按标题栏上的按钮不该拖窗 */
    const r=w.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
    grab(e,ev=>{                                              /* 夹住边界，别把窗拖出屏幕外找不回来 */
      w.style.left=clamp(ev.clientX-dx,-r.width+90,innerWidth-90)+"px";
      w.style.top=clamp(ev.clientY-dy,0,innerHeight-34)+"px";});};
  w.querySelectorAll("[data-rz]").forEach(h=>h.onmousedown=e=>{
    const m=h.dataset.rz,r=w.getBoundingClientRect();
    const x0=e.clientX,y0=e.clientY,w0=r.width,h0=r.height;
    grab(e,ev=>{
      if(m!=="s")w.style.width=Math.max(340,w0+ev.clientX-x0)+"px";
      if(m!=="e")w.style.height=Math.max(200,h0+ev.clientY-y0)+"px";});});
})();

/* ══ 心跳 ══
   服务端靠这个判断页面还开着，没人看着就自己退出，不留僵尸进程。

   ⚠️ 这里踩过一个不容易想到的坑：**浏览器会掐后台标签页的定时器**。
   Chromium 系在标签页隐藏满 5 分钟后进入 intensive throttling，setInterval 被压到每分钟最多一次。
   服务端原来 40 秒没收到就退出，于是"切去看个视频十几分钟回来，程序自己关了、页面还在"。
   两头一起改：服务端把超时放宽到 3 分钟（见 Program.Idle），这边在页面重新可见时立刻补一发。 */
let dead=false;
const ping=()=>fetch("/api/ping").then(r=>{if(r.ok)alive();},serverGone);
ping();setInterval(ping,10000);

/* ══ 长连接（真正管用的那个）══
   报到和 pagehide 那一发告别都是"请浏览器帮个忙"：定时器会被掐，卸载途中的请求不保证送得出去
   （关整个窗口时尤其容易丢）。于是就出现了"标签页关了、程序还赖着"。

   这里开一条 SSE 长连接：**标签页一没，socket 立刻断，是操作系统告诉服务端的，不用页面配合**。
   反过来也一样——服务端没了，这边 onerror 立刻响，不用等下一次心跳（后台还可能被压到一分钟一次）。
   令牌走查询串：EventSource 发不了自定义头。 */
try{
  const live=new EventSource("/live?t="+encodeURIComponent(TOK));
  live.onopen=alive;
  live.onerror=()=>{ if(live.readyState===EventSource.CLOSED||live.readyState===EventSource.CONNECTING)serverGone(); };
}catch(_){ /* 没有 EventSource 就退回上面那套心跳，服务端也留着旧的超时兜底 */ }
/* 从后台切回来立刻补一发：别等下一个 tick，被掐着的时候那可能是一分钟以后 */
addEventListener("visibilitychange",()=>{if(!document.hidden)ping();});
addEventListener("focus",ping);

/* 页面要走了就说一声，服务端不用干等超时。
   pagehide 按 F5 刷新时同样会触发，所以服务端收到后**只是开始计时**，
   宽限期内新页面报到就撤销——判断"是关闭还是刷新"的活儿在服务端那边做（见 WatchBrowser）。
   keepalive 让这一发在页面卸载途中也能发出去，同时还能带上令牌。 */
addEventListener("pagehide",()=>{
  try{fetch("/api/bye",{method:"POST",keepalive:true,headers:{"X-Token":TOK}});}catch(_){}});

/* 服务端没了的话，页面就是一张什么都点不动的死页。它自己关不掉自己
   （不是脚本开的窗，window.close 会被浏览器拦），那至少得说清楚发生了什么。 */
function serverGone(){
  if(dead)return;dead=true;
  const d=document.createElement("div");d.className="deadwrap";
  d.innerHTML=`<div class="deadbox"><b>${T("srv_gone")}</b><span>${T("srv_gone_d")}</span></div>`;
  document.body.appendChild(d);}
function alive(){
  if(!dead)return;dead=false;
  const d=document.querySelector(".deadwrap");if(d)d.remove();}

/* gotoNode：打开后直接停在某个节点上。任务编辑器"点挂接行跳过来"就靠它 */
async function loadDoc(path,gotoNode){

    doc=parseDlg(d.text);filePath=d.path;relaid=false;savedText="";

    cur=gotoNode&&doc.nodes[gotoNode]?gotoNode
        :doc.start in doc.nodes?doc.start:Object.keys(doc.nodes)[0];
    beat=doc.nodes[cur]?doc.nodes[cur].narr.length:0;
    hide();render();savedText=docSnap();markDirty(false);
    /* 打开就直接摊开说：这种"能打开、不报错、进游戏才发现不对"的东西，
       等用户自己去点一个角标是不现实的 */
    if(COMPAT.length){const b=document.querySelector("[data-compat]");if(b)compatPane(b);}

/* 浮层：挂在「打开」按钮底下。
   以前是硬算屏幕中上方的，结果面板飘在左上角、离触发它的按钮十万八千里，
   看着像是从别的地方冒出来的。按钮在右边，所以右对齐着往下挂。
   按钮不在的时候（还没渲染到对话页）才退回屏幕中上方。 */
function place2(html){
  const p=$("pop");p.innerHTML=html;p.classList.add("on");
  p.style.left="-9999px";p.style.top="0";          /* 先量宽度，再定位 */
  const w=p.offsetWidth,m=12,b=$("openBtn");
  if(b){const r=b.getBoundingClientRect();
    p.style.left=Math.max(m,Math.min(r.right-w,innerWidth-w-m))+"px";
    p.style.top=(r.bottom+6)+"px";}
  else{p.style.left=Math.max(m,(innerWidth-w)/2)+"px";p.style.top="76px";}
  return p;}</script>
