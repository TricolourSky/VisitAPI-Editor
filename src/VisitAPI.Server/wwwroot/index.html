<meta charset="utf-8">
<!--TOKEN-->
<link rel="icon" href="/ui/favicon.ico">
<title>AIC CONSOLE — VisitAPI Editor</title>

<!--
  v5：不再用手编的样例，直接吃 SORA 的真实 .dlg（90726f6a656374536f726132.dlg）。
  页面里内置了一个 JS 解析器，逻辑对齐插件里的 DialogParser.cs —— 这也是"共享库"
  那一刀的可行性验证：同一份文本，两边解析出同一张图。
  背景图为真实素材（压到 960px 预览尺寸），SORA.mp4 原样嵌入以演示视频背景。
-->

<style>
/* ══════════════════════════════════════════════════════════════════════
   AIC CONSOLE v4 — 按终末地实物校正

   v3 错在三处，这版全改：
     ① 主色：柠檬黄 #F2E205 才是终末地的主色，橙是配角（只用在告警/小标记）
     ② 明暗：交互性的"机壳"是浅色斜切面板压在暗场景上——不是全暗
     ③ 图标：粗实心块面，不是细描边

   新增的"零件"：规格标签、标题粗竖条、装饰字符串、连接走线、斜纹底、水印字。
   这些零件才是那股味道的来源，不是配色。
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --y:#F2E205;--y-ink:#141306;--y-dim:#9A9105;
  --o:#FF6A12;--tech:#3FD0C9;--err:#FF4242;--ok:#7BD86A;
  /* 机壳：浅色斜切面板 */
  --chrome:#E7E7E4;--chrome-2:#CBCBC6;--chrome-ink:#141619;--chrome-line:#A8A8A2;
  /* 内容：暗面 */
  --ground:#0C0D10;--panel:#15171B;--panel-2:#1B1E23;--panel-3:#23272E;
  --line:#282D34;--line-2:#3A414A;
  --ink:#F0EEE8;--ink-2:#949BA4;--ink-3:#5A616B;
  --ui:"Bahnschrift","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas","Microsoft YaHei UI",monospace;
  --g-ink:#DEDEDB;--g-dim:#7A7D82;--g-gold:#B9BCC1;--g-hot:#F2E205;
  --spine:74px;--hdr:64px;--tel:26px;--sk:-11deg;
  --grid-1:rgba(255,255,255,.05);--grid-2:rgba(255,255,255,.017);
  --node-bg:#171A1F;--graph-bg:#0A0B0E;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --chrome:#FBFBF9;--chrome-2:#DEDED9;--chrome-ink:#101215;--chrome-line:#B4B4AE;
  --ground:#C6C3BA;--panel:#E7E4DC;--panel-2:#DCD9D0;--panel-3:#CFCBC2;
  --line:#B7B3A9;--line-2:#9B968D;
  --ink:#101215;--ink-2:#4D535A;--ink-3:#83898F;
  --y:#E8D800;--y-ink:#141306;--o:#D9540A;--tech:#12817A;--err:#C0322F;--ok:#2C7A44;
  --grid-1:rgba(15,17,20,.08);--grid-2:rgba(15,17,20,.03);
  --node-bg:#F5F3ED;--graph-bg:#D6D2C8;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* ⚠️ 这份页面**没有 <!doctype html>**，浏览器跑在 quirks mode 里，而 quirks mode 有一条老规矩：
   **<table> 不继承外面的字体**，它退回默认的 16px。于是说明页里表格的字比正文明显大一号。
   补一个 doctype 是"正确"的修法，但整套界面都是在 quirks mode 下调出来的，
   一改渲染模式全站都要重新对一遍——不值得。这里让表格显式继承就够了。 */
table{font:inherit;color:inherit}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
svg{display:block}

/* ══ 滚动条 ══
   浏览器默认那根在这套工业面板里非常出戏（圆头、亮灰、带渐变）。照四条铁律重画：
     形状 — 直角，滑块两边留 2px 让它像嵌在槽里的一条金属片
     厚度 — 静止纯平（只有一层斜纹），**没有任何投影**
     颜色 — 石墨灰阶；hover 才提亮，**只有正在拖的时候才亮黄**（拖动＝当前操作）
     轨道 — 透明。全站有 panel / panel-2 / graph-bg 好几种底色，
            给轨道写死一个颜色就会在某些面板上浮出一条色差带
   变量全部走 :root，所以明亮主题自动跟着换，不用另写一套。

   ⚠️ **绝对不能在这里写 scrollbar-width / scrollbar-color**（那两个是标准属性）：
      Chromium 只要见到它们，就会把 ::-webkit-scrollbar 这一整套**全部忽略**，
      滚动条直接打回浏览器默认样式 —— 改了半天没效果，还极难查。
      `#navItems` 是**故意**用 scrollbar-width:none 把滚动条整根藏掉的（侧脊里不该有滚动条），
      那一处保持原样，它的 id 选择器权重也压得住下面这些通配规则。 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background-color:var(--line-2);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px);
  background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-thumb:hover{background-color:var(--ink-3)}
::-webkit-scrollbar-thumb:active{background-color:var(--y)}

#sky{position:fixed;inset:0;z-index:0}
.shell{position:relative;z-index:1;display:flex;height:100vh}

/* 斜切：整套 UI 统一 -11°，内层反向抵消让文字保持正 */
.sk{transform:skewX(var(--sk))}
.sk>*{display:block;transform:skewX(calc(var(--sk) * -1))}

/* 斜纹底：贴在暗面上的工业纹理 */
.hatch{background-image:repeating-linear-gradient(-45deg,
  rgba(255,255,255,.022) 0 2px,transparent 2px 7px)}

/* ══ 侧脊：浅色机壳斜切块 ══ */
.nav{width:var(--spine);flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;position:relative;z-index:3}
.nav::after{content:"";position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.02) 0 2px,transparent 2px 8px)}
/* 标块保持满宽：它是栏头不是按钮，跟数据头齐平才压得住 */
.mark{width:100%;height:var(--hdr);flex:0 0 auto;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;background:var(--y);color:var(--y-ink);
  border:0;position:relative;z-index:1}
.mark b{font-size:16px;font-weight:700;letter-spacing:.08em;line-height:1}
.mark i{font:9px/1 var(--mono);font-style:normal;letter-spacing:.06em;opacity:.7}
/* 上下两组用完全同一套规则——之前 navBottom 少写了 flex 居中，
   结果设置按钮靠左、上面六个居中，两边对不齐。满宽平铺后这个问题不存在了。 */
/* 侧脊右侧留 14px 当"指示灯槽"：按钮一律贴左，槽平时是空的，
   只有当前项会在槽里点亮一条黄条。选中信号和按钮本体分离，互不干扰。 */
#navItems,#navBottom{width:100%;display:flex;flex-direction:column;gap:1px;
  align-items:flex-start;position:relative;z-index:1}
/* 七格之后要留退路：实测 600px 高的窗口只剩 3px 余量，再矮就会顶到底部的设置按钮。
   min-height:0 让 flex 允许它被压缩（不写的话 flex 子项默认不肯缩到内容以下），
   overflow:auto 让它在挤不下时自己滚 —— 退化成滚动，而不是叠在一起。 */
#navItems{padding-top:1px;min-height:0;overflow-y:auto;scrollbar-width:none}
#navItems::-webkit-scrollbar{width:0}
.nav .sp{flex:1 1 auto;width:100%;position:relative;z-index:1}
.nav .sp::after{content:"AIC // VISITAPI EDITOR";position:absolute;left:50%;bottom:22px;
  transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;
  font:9.5px/1 var(--mono);letter-spacing:.3em;color:var(--ink-3);white-space:nowrap}
/* 浅色机壳块 + 黑色实心图标 —— 主菜单按钮的形状语言 */
/* ── 交互态才有厚度 ──
   静止：纯平色块 + 发丝描边，一点渐变和投影都没有。
   悬停：抬起来（投影 + 顶边高光）。按下：陷进去（内阴影）。
   立体感是"发生"出来的，不是"长"在按钮上的——这是终末地按钮的关键。 */
.nitem{width:calc(100% - 14px);height:50px;border:0;cursor:var(--cur-p);padding:0;position:relative;
  background:var(--chrome);color:var(--chrome-ink);
  display:flex;align-items:center;justify-content:center;box-shadow:none}
.nitem>span{display:flex;flex-direction:column;align-items:center;gap:2px}
.nitem svg{width:22px;height:22px}
.nitem em{font:8.5px/1 var(--mono);font-style:normal;letter-spacing:.08em;opacity:.65}
.nitem:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 16px rgba(0,0,0,.55)}
.nitem:active{box-shadow:inset 0 3px 7px rgba(0,0,0,.45);transform:translateY(1px)}
.nitem[aria-current="true"]{background:var(--y);color:var(--y-ink);box-shadow:none}
.nitem[aria-current="true"]:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(242,226,5,.28)}
/* 当前项右侧探出的黄条，把选中钉进内容区 */
.nitem[aria-current="true"]::after{content:"";position:absolute;right:-14px;top:0;bottom:0;width:5px;
  background:var(--y);box-shadow:0 0 14px rgba(242,226,5,.6)}
.nitem:focus-visible{outline:2px solid var(--o);outline-offset:2px}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.dlgwrap{display:flex;flex-direction:column;height:100%;min-height:0}

/* ══ 数据头 ══ */
.hdr{flex:0 0 auto;height:var(--hdr);display:flex;align-items:center;gap:0;
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.02) 0 2px,transparent 2px 8px)}
/* 标题左侧粗竖条 —— 实物里每个大标题都有 */
.hdr .slab{width:6px;height:30px;background:var(--y);margin:0 .85rem 0 1.1rem;flex:0 0 auto}
.hdr .tt{display:flex;flex-direction:column;gap:1px;padding-right:1.1rem}
.hdr .tt i{font:9.5px/1 var(--mono);font-style:normal;letter-spacing:.2em;color:var(--ink-3)}
.hdr h2{font-size:21px;font-weight:700;letter-spacing:.1em;line-height:1.1;white-space:nowrap}
/* 装饰字符串：实物里标题下那行看不懂的字符，这里换成真的商人 ID */
.hdr .glyph{font:8.5px/1 var(--mono);letter-spacing:.42em;color:var(--ink-3);opacity:.55;
  white-space:nowrap;overflow:hidden;max-width:250px}
.cart{align-self:stretch;display:flex;align-items:center;gap:1.05rem;padding:0 1.1rem;
  border-left:1px solid var(--line);position:relative}
.cart::before{content:"";position:absolute;left:-1px;top:12px;width:9px;height:1px;background:var(--y);opacity:.8}
.cart::after{content:"";position:absolute;left:8px;top:12px;width:1px;height:9px;background:var(--y);opacity:.8}
.cart div{display:flex;flex-direction:column;gap:1px}
.cart k{font:8.5px/1 var(--mono);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.cart v{font:11.5px/1.25 var(--mono);color:var(--ink)}
.cart div.edit{cursor:var(--cur-p)}
.cart div.edit:hover v,.cart div.edit:hover k{color:var(--y)}
.pop .fld{display:block;margin-bottom:.5rem}
.pop .fld i{display:block;font:8.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:.25rem;font-style:normal}
.pop .fld input{width:100%;box-sizing:border-box;padding:.3rem .45rem;background:var(--panel);
  border:0;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink);font:11.5px var(--mono)}
.pop .fld input:focus{outline:0;box-shadow:inset 0 0 0 1px var(--y)}
.pop .hint{font-size:10.5px;line-height:1.6;color:var(--ink-3)}
.pop .fld select{width:100%;box-sizing:border-box;padding:.28rem .4rem;background:var(--panel);
  border:0;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink);font:11.5px var(--mono)}
/* 触发点：一行一条，点开就是那条的表单 */
.trrow{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:0;cursor:var(--cur-p);
  background:var(--panel-3);color:var(--ink-2);padding:.3rem .5rem;margin-bottom:2px;font-size:11.5px}
.trrow:hover{background:var(--y);color:var(--y-ink)}
.trrow b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trrow span{margin-left:auto;font:8.5px/1 var(--mono);opacity:.6}
.trxyz{display:flex;gap:.3rem}.trxyz .fld{flex:1 1 0;min-width:0}
/* 节点标题上的 ⋮：平时压暗，鼠标到这张卡上才亮，免得每张卡上都戳着一个点 */
.ghead .grole{margin-left:.35rem;font-style:normal;cursor:var(--cur-p);opacity:.35;padding:0 .15rem}
.gnode:hover .ghead .grole{opacity:.8}
.ghead .grole:hover{opacity:1;color:var(--y)}
.gnode[data-start="1"] .ghead .grole:hover,.gnode[data-entry="1"] .ghead .grole:hover{color:inherit}
/* 旧版剧本的提示：橙色，和"未实现/要注意"是同一套颜色语言 */
.cart div.old k,.cart div.old v{color:var(--o)}
.cprow{margin-bottom:.55rem}
.cprow b{display:block;font-size:11.5px;color:var(--o)}
.cprow .cpline{font:10.5px/1.5 var(--mono);color:var(--ink-3);margin:.1rem 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprow span{display:block;font-size:11px;line-height:1.6;color:var(--ink-2)}

/* ══ 新手引导 ══
   四块半透明的遮罩围出一个"洞"，洞里那个元素保持原样、且**照样能点**
   （遮罩自己 pointer-events:none，只有气泡吃鼠标）。 */
.tourwrap{position:fixed;inset:0;z-index:180;pointer-events:none}
.tourhole{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.62),inset 0 0 0 2px var(--y);
  border-radius:1px}
.tourtip{position:fixed;z-index:181;pointer-events:auto;max-width:320px;
  background:var(--panel);box-shadow:0 0 0 1px var(--line-2),0 18px 44px rgba(0,0,0,.6);
  padding:.7rem .8rem}
.tourtip b{display:block;font-size:13px;color:var(--y);margin-bottom:.28rem}
.tourtip span{display:block;font-size:12px;line-height:1.7;color:var(--ink-2)}
.touracts{display:flex;align-items:center;gap:.4rem;margin-top:.6rem}
.touracts i{font-style:normal;font:9.5px/1 var(--mono);letter-spacing:.14em;color:var(--ink-3);margin-right:auto}

/* ══ 程序内弹窗 ══ 盖住整屏，居中一个盒子。浏览器自带的那三个太出戏 */
.mdwrap{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center}
.mdbox{min-width:320px;max-width:min(520px,92vw);background:var(--panel);
  box-shadow:0 0 0 1px var(--line-2),0 28px 66px rgba(0,0,0,.7)}
.mdhead{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);background:var(--panel-2);
  font:10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.mdhead .slab{width:4px;height:16px;background:var(--y);flex:0 0 auto}
.mdbody{padding:.9rem;font-size:12.5px;line-height:1.7;color:var(--ink)}
.mdin{width:calc(100% - 1.8rem);margin:0 .9rem;box-sizing:border-box;padding:.4rem .5rem;
  background:var(--panel-3);border:0;box-shadow:inset 0 0 0 1px var(--line-2);
  color:var(--ink);font:12.5px var(--mono)}
.mdin:focus{outline:0;box-shadow:inset 0 0 0 1px var(--y)}
.mdacts{display:flex;justify-content:flex-end;gap:.4rem;padding:.9rem}
.btn.warn{background:var(--o);color:#170A03}
.btn.warn:hover{filter:brightness(1.1)}
.hdr .sp{flex:1 1 auto}
#bars{align-self:center;display:flex;align-items:flex-end;gap:2px;height:22px;padding:0 1.1rem}
#bars i{display:block;width:1px;height:100%;background:var(--ink-3)}
#bars i.e{width:2px;background:var(--y)}
#bars i.t{width:2px;background:var(--tech)}
.hdr .saved{align-self:center;font:10px/1 var(--mono);letter-spacing:.08em;color:var(--ink-3);
  white-space:nowrap;text-transform:uppercase}
.hdr .saved.hot{color:var(--ok)}.hdr .saved.dirty{color:var(--y)}
.hdr .stat{align-self:center;font:11px/1 var(--mono);color:var(--o);padding:0 .9rem;white-space:nowrap}
.hdr .stat.clean{color:var(--ok)}
.hdr .acts{align-self:center;display:flex;align-items:center;gap:7px;padding:0 1rem 0 0}

/* 按钮：浅色机壳斜块，主操作填黄 */
.btn{background:var(--chrome);border:0;position:relative;
  color:var(--chrome-ink);font-weight:700;padding:0;font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;cursor:var(--cur-p);white-space:nowrap;transform:skewX(var(--sk));
  box-shadow:none}
.btn>span{display:block;transform:skewX(calc(var(--sk) * -1));padding:.44rem .95rem}
.btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 16px rgba(0,0,0,.5)}
.btn:active{box-shadow:inset 0 3px 7px rgba(0,0,0,.4);transform:skewX(var(--sk)) translateY(1px)}
.btn.pri{background:var(--y)}
.btn.pri:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(242,226,5,.34)}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{color:var(--y);background:rgba(242,226,5,.06);
  box-shadow:inset 0 0 0 1px var(--y),0 5px 14px rgba(0,0,0,.45)}
.saved{font:10px/1 var(--mono);color:var(--ink-3)}
.saved.hot{color:var(--ok)}.saved.dirty{color:var(--y)}
.tape{flex:0 0 auto;height:4px;background:repeating-linear-gradient(-45deg,
  var(--line-2) 0 6px,transparent 6px 12px)}
.tape.hot{background:repeating-linear-gradient(-45deg,var(--o) 0 6px,#1A0E05 6px 12px)}

/* ══ 工作区 ══ */
.work{flex:1 1 auto;min-height:0;display:flex;position:relative}
/* 巨大水印字：实物里每屏左上角都压着一个半透明大字 */
.graph::before{content:"FLOW";position:absolute;right:52px;bottom:6px;z-index:0;
  font:800 108px/.85 var(--ui);letter-spacing:.02em;color:var(--ink);opacity:.045;
  pointer-events:none;white-space:nowrap}
/* 流程区四角刻度括号 */
.graph::after{content:"";position:absolute;left:32px;top:10px;width:22px;height:22px;z-index:0;
  border-left:2px solid var(--line-2);border-top:2px solid var(--line-2);pointer-events:none}
.stagepane::before{content:"VIEWPORT";position:absolute;left:.9rem;bottom:.5rem;z-index:0;
  font:800 46px/1 var(--ui);letter-spacing:.06em;color:var(--ink);opacity:.04;
  pointer-events:none;white-space:nowrap}
.viewport{flex:0 0 43%;min-width:280px;display:flex;flex-direction:column;min-height:0;
  position:relative;background:var(--panel);z-index:1}
.vtab{flex:0 0 auto;height:26px;display:flex;align-items:center;gap:.6rem;padding:0 .3rem 0 .7rem;
  background:var(--panel-2);border-bottom:1px solid var(--line)}
.vtab b{font:9.5px/1 var(--mono);letter-spacing:.24em;color:var(--y);text-transform:uppercase}
.vtab .bgtag{font:10px/1 var(--mono);color:var(--ink-3);margin-left:auto}
.vfold{width:24px;height:20px;border:0;background:transparent;color:var(--ink-3);cursor:var(--cur-p);
  font-size:12px;line-height:1;padding:0}
.vfold:hover{color:var(--y);background:var(--panel-3)}

/* 分拍页签：实物里 节点｜日常｜索引 那条，选中是实心黄块 */
.beatbar{flex:0 0 auto;display:flex;align-items:stretch;gap:0;height:31px;
  background:var(--panel);border-bottom:1px solid var(--line);padding:0 .5rem;overflow-x:auto}
.beat{border:0;background:none;color:var(--ink-2);cursor:var(--cur-p);font-size:11.5px;
  letter-spacing:.08em;padding:0 .85rem;white-space:nowrap;position:relative;flex:0 0 auto}
.beat+.beat::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.beat:hover{color:var(--ink)}
.beat[aria-current="true"]{background:var(--y);color:var(--y-ink);font-weight:700}
.beat[aria-current="true"]::before,.beat[aria-current="true"]+.beat::before{display:none}
#addBeat{color:var(--ink-3);font-size:13px;padding:0 .7rem}
#addBeat:hover{color:var(--y)}

.stagepane{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:1.4rem 1.2rem;position:relative;
  background:linear-gradient(90deg,var(--grid-2) 1px,transparent 1px) 0 0/34px 34px,
             linear-gradient(var(--grid-2) 1px,transparent 1px) 0 0/34px 34px}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;height:100%;width:auto;
  background:#000;outline:1px solid var(--line-2);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.stage::before,.stage::after{content:"";position:absolute;width:20px;height:20px;z-index:7;
  pointer-events:none;border:2px solid var(--y)}
.stage::before{left:-7px;top:-7px;border-right:0;border-bottom:0}
.stage::after{right:-7px;bottom:-7px;border-left:0;border-top:0}
.stage .bglayer{position:absolute;inset:0;cursor:var(--cur-p);background-size:cover;
  background-position:center;background-color:#0E0F10;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .bglayer.empty{background-image:repeating-linear-gradient(45deg,#0E0F10 0 14px,#15161A 14px 28px)}
.stage .shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(transparent 45%,rgba(0,0,0,.55))}
.bghint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--g-dim);font-size:13px;pointer-events:none}
.bgtag{font:10px/1 var(--mono);color:var(--ink-3)}

/* 游戏对话框：塔科夫原生外观，故意不参与本主题 */
.gamebox{position:absolute;left:50%;transform:translateX(-50%);bottom:4%;width:82%;z-index:4;
  background:rgba(10,10,12,.93);border:1px solid #2E3137;box-shadow:0 10px 34px rgba(0,0,0,.6)}
.gwho{padding:.36rem .8rem;border-bottom:1px solid #22242A;font-size:12px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--g-gold)}
.npc,.narr{padding:.7rem .85rem;min-height:52px;outline:0;color:var(--g-ink);
  border-bottom:1px solid #22242A;font-size:13.5px;line-height:1.7}
.narr{font-style:italic;color:#A9ACB1}
.npc:empty::before,.narr:empty::before,.otext:empty::before{content:attr(data-ph);
  color:var(--g-dim);font-style:normal}
.npc:hover,.narr:hover{background:#17181C}
.npc:focus,.narr:focus{background:#1D1F24;box-shadow:inset 2px 0 0 var(--g-hot)}
.optrow{display:flex;align-items:center;gap:.4rem;padding:.32rem .5rem .32rem .2rem;
  border-bottom:1px solid #22242A}
.optrow:hover{background:#17181C}
.kebab,.del{border:0;background:none;color:var(--g-dim);cursor:var(--cur-p);flex:0 0 auto}
.kebab{width:18px;font-size:13px}.del{width:18px;font-size:11px}
.kebab:hover{color:var(--g-gold)}.del:hover{color:var(--err)}
.ico{width:14px;height:14px;flex:0 0 auto;opacity:.8;filter:brightness(1.35)}
.otext{flex:1 1 auto;outline:0;font-size:12.5px;color:var(--g-ink);min-width:30px}
.otext:focus{box-shadow:inset 0 -1px 0 var(--g-hot)}
.jump{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;color:var(--g-gold);background:#191B1F;
  border:1px solid #3A3E45;padding:.06rem .3rem;cursor:var(--cur-p)}
.jump:hover{background:var(--g-hot);color:#0B0B0C}
.jump.bad{color:var(--err);border-color:#5A2E30}
.jump.end{color:var(--g-dim);border-color:#2E3137}
.chip{flex:0 0 auto;font-family:var(--mono);font-size:9px;color:#8CC07C;border:1px solid #2F3A2C;
  padding:.02rem .26rem}
.chip.g{color:#D8C24E;border-color:#43402A}
.chip.s{color:#DCA3C6;border-color:#432F3E}
.addopt{width:100%;padding:.32rem .85rem;background:none;border:0;color:var(--g-dim);
  cursor:var(--cur-p);font-size:11.5px;text-align:left}
.addopt:hover{color:var(--g-hot);background:#17181C}

.vsplit{flex:0 0 auto;width:7px;cursor:var(--cur-ew);background:var(--panel);z-index:1;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.vsplit::after{content:"";width:3px;height:46px;
  background:repeating-linear-gradient(180deg,var(--line-2) 0 3px,transparent 3px 6px)}
.vsplit:hover::after{background:repeating-linear-gradient(180deg,var(--y) 0 3px,transparent 3px 6px)}

/* 折叠态 */
.work.folded .viewport{flex:0 0 27px;min-width:27px}
.work.folded .vsplit,.work.folded .stagepane,.work.folded .beatbar{display:none}
.work.folded .vtab{height:100%;flex-direction:column;justify-content:flex-start;padding:.5rem 0;
  gap:.5rem;border-bottom:0;border-right:1px solid var(--line)}
.work.folded .vtab b{writing-mode:vertical-rl;letter-spacing:.22em}
.work.folded .vtab .bgtag{display:none}
.work.folded .vfold{transform:rotate(180deg);margin-top:auto;margin-bottom:.3rem}

/* ══ 流程区 ══ */
.graph{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;background:var(--graph-bg);z-index:1;
  background-image:linear-gradient(var(--grid-1) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-1) 1px,transparent 1px),
    linear-gradient(var(--grid-2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-2) 1px,transparent 1px);
  background-size:130px 130px,130px 130px,26px 26px,26px 26px;cursor:var(--cur-cr)}
.graph.panning{cursor:var(--cur-gg)}
.gviewport{position:absolute;inset:0;transform-origin:0 0}
.gedge{position:absolute;inset:0;overflow:visible;pointer-events:none}
/* 章节索引条：一条故事线一根刻度，颜色跟节点头一致，点了直接跳过去。
   灵感来自实物左缘那列彩色刻度——但那是装饰，这条是能点的导航。 */
.bandrail{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:6;background:var(--panel);
  border-right:1px solid var(--line);padding:6px 0}
.bandrail i{position:absolute;left:5px;width:12px;height:3px;background:var(--ink-3);cursor:var(--cur-p);
  transition:width .1s,left .1s,box-shadow .1s}
.bandrail i.s{background:var(--y)}
.bandrail i.e{background:var(--o)}
.bandrail i.t{background:var(--tech)}
.bandrail i:hover{left:2px;width:18px;box-shadow:0 0 10px currentColor}
.bandrail i.on{left:2px;width:18px;height:4px}
.gtools{position:absolute;right:0;top:0;bottom:0;width:40px;display:flex;flex-direction:column;
  align-items:center;padding:.45rem 0;gap:4px;z-index:6;background:var(--panel);
  border-left:1px solid var(--line)}
.gtools button{width:30px;height:28px;border:0;cursor:var(--cur-p);padding:0;font-size:12px;
  background:var(--chrome);color:var(--chrome-ink);box-shadow:none;font-weight:700}
.gtools button>span{display:block}
.gtools button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 5px 13px rgba(0,0,0,.55)}
.gtools button:active{box-shadow:inset 0 3px 7px rgba(0,0,0,.45);transform:translateY(1px)}
.gtools button.pri{background:var(--y);color:var(--y-ink);box-shadow:none}
.gtools button.pri:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 5px 14px rgba(242,226,5,.3)}
.gtools .sep{width:24px;height:1px;background:var(--line-2);margin:.3rem 0}
.ghint{display:none}

/* 节点卡：顶部规格条 + 右侧型号码，照实物卡片的做法 */
.gnode{position:absolute;width:200px;background:var(--node-bg);
  box-shadow:0 0 0 1px var(--line-2),0 5px 16px rgba(0,0,0,.42);overflow:hidden;user-select:none}
.gnode[data-cur="1"]{box-shadow:0 0 0 2px var(--y),0 0 22px rgba(242,226,5,.28)}
.gnode.orphan{opacity:.42}
.ghead{padding:.24rem .45rem .24rem .5rem;font:10.5px/1.4 var(--mono);letter-spacing:.03em;
  color:var(--ink);cursor:var(--cur-gb);background:var(--panel-3);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.3rem}
.ghead em{margin-left:auto;font-style:normal;font-size:8.5px;letter-spacing:.14em;opacity:.6}
.gname{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--y);color:var(--ink);
  font:inherit;padding:0 .18rem;outline:none;cursor:var(--cur-t)}
.gnode[data-start="1"] .ghead{background:var(--y);color:var(--y-ink);font-weight:700}
.gnode[data-entry="1"] .ghead{background:var(--o);color:#170A03;font-weight:700}
.gnode[data-trig="1"] .ghead{background:var(--tech);color:#04201D;font-weight:700}
.ghead .w{color:var(--err)}
.bandlab{position:absolute;font:600 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--ink-3);
  pointer-events:none;text-transform:uppercase}
.gpeek{padding:.2rem .5rem;font-size:10px;color:var(--ink-3);border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{position:relative;display:flex;align-items:center;gap:.3rem;padding:.11rem .5rem;
  font-size:10.5px;color:var(--ink-2);height:19px}
.grow:hover{background:rgba(242,226,5,.12);color:var(--ink)}
.grow .t{flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.grow .rsv{font:8.5px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line-2);padding:0 .18rem}
.grow .q{font:8.5px/1.5 var(--mono);color:var(--y-ink);background:var(--y);padding:0 .22rem;font-weight:700}
.sock{position:absolute;width:8px;height:8px;background:var(--y);outline:1px solid var(--graph-bg);
  right:-4px;top:50%;transform:translateY(-50%) rotate(45deg)}
.sock.bad{background:var(--err)}
.sock.end{background:var(--ink-3)}
.sockin{position:absolute;width:8px;height:8px;background:var(--tech);
  outline:1px solid var(--graph-bg);left:-4px;top:12px;transform:rotate(45deg)}
.gempty{padding:.15rem .5rem;font-size:10px;color:var(--ink-3);font-style:italic}

/* ══ 遥测条 ══ */
.telem{flex:0 0 auto;height:var(--tel);display:flex;align-items:center;gap:1.3rem;padding:0 .95rem;
  background:var(--panel);border-top:1px solid var(--line);font:10px/1 var(--mono);
  letter-spacing:.1em;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.telem .sp{flex:1 1 auto}
.telem b{color:var(--ink-2);font-weight:400}
.telem em{font-style:normal;color:var(--y);letter-spacing:.06em}
.telem .hint{text-transform:none;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}

/* ══ 浮层 ══ */
.pop{position:fixed;z-index:80;background:var(--panel-2);
  box-shadow:0 0 0 1px var(--line-2),0 20px 50px rgba(0,0,0,.62);
  padding:.75rem;min-width:236px;max-width:340px;display:none;max-height:70vh;overflow:auto}
.pop.on{display:block}
.pop h4{font:9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--y);
  margin:.85rem 0 .4rem}
.pop h4:first-child{margin-top:0}
.opts2{display:flex;flex-wrap:wrap;gap:3px}
.opts2 button{padding:.24rem .55rem;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);
  border:0;color:var(--ink-2);font-size:11px;cursor:var(--cur-p)}
.opts2 button:hover{color:var(--y);box-shadow:inset 0 0 0 1px var(--y)}
.opts2 button[aria-pressed="true"]{background:var(--y);color:var(--y-ink);font-weight:700;box-shadow:none}

/* ══ 源码窗 ══ */
.srcwrap{position:fixed;left:9vw;top:7vh;width:58vw;height:72vh;min-width:340px;min-height:200px;
  z-index:90;background:var(--panel);box-shadow:0 0 0 1px var(--line-2),0 28px 66px rgba(0,0,0,.7);
  display:none;flex-direction:column;overflow:hidden}
.srcwrap.on{display:flex}
.srcwrap header{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);cursor:var(--cur-mv);user-select:none;flex:0 0 auto;background:var(--panel-2)}
.srcwrap header b{pointer-events:none;font:11px/1 var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--y)}
.srcwrap textarea{flex:1 1 auto;min-height:0;resize:none;margin:0;padding:.9rem 1rem;
  background:transparent;border:0;outline:none;font-family:var(--mono);
  font-size:12px;line-height:1.75;color:var(--ink-2);white-space:pre;overflow:auto;tab-size:2}
.srcgrip{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:var(--cur-nw);z-index:2}
.srcgrip::after{content:"";position:absolute;right:5px;bottom:5px;width:9px;height:9px;
  border-right:2px solid var(--y);border-bottom:2px solid var(--y)}
.srcedge{position:absolute;z-index:1}
.srcedge.e{right:0;top:0;bottom:0;width:6px;cursor:var(--cur-ew)}
.srcedge.s{left:0;right:0;bottom:0;height:6px;cursor:var(--cur-ns)}

/* ══ 设置 / 占位页 ══ */
.setwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:2rem 2.3rem;max-width:860px;width:100%;
  position:relative}
.secline{display:flex;align-items:center;gap:1rem;margin-bottom:1.6rem}
.secline .slab{width:7px;height:44px;background:var(--y);flex:0 0 auto}
.setwrap h1{font-size:24px;font-weight:700;letter-spacing:.13em;line-height:1.1}
.setwrap .lede{font:9.5px/1 var(--mono);letter-spacing:.24em;color:var(--ink-3);margin-top:.35rem}
.secline .rule{flex:1 1 auto;height:4px;
  background:repeating-linear-gradient(-45deg,var(--line-2) 0 6px,transparent 6px 12px)}
/* 卡片头：色条 + 型号码，照实物卡片 */
.card{position:relative;background:var(--panel);box-shadow:0 0 0 1px var(--line);
  margin-bottom:1rem;padding:0 1.2rem .1rem}
.card>.chead{display:flex;align-items:center;height:22px;margin:0 -1.2rem .2rem;
  padding:0 .7rem;background:var(--y);color:var(--y-ink);
  font:9px/1 var(--mono);letter-spacing:.2em;font-weight:700;text-transform:uppercase}
.card>.chead span{margin-left:auto;opacity:.65}
.card.alt>.chead{background:var(--o);color:#170A03}
.card.note>.chead{background:var(--panel-3);color:var(--ink-2)}
.row{display:flex;align-items:center;gap:1.2rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lbl{flex:1 1 auto;min-width:0}
.row .lbl b{display:block;font-size:13.5px;font-weight:600;letter-spacing:.06em}
.row .lbl span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:.15rem}
.seg{display:flex;box-shadow:inset 0 0 0 1px var(--line-2);flex:0 0 auto}
.seg button{border:0;background:none;color:var(--ink-2);font-size:11.5px;letter-spacing:.1em;
  padding:.36rem .95rem;cursor:var(--cur-p);white-space:nowrap;text-transform:uppercase}
.seg button:hover{color:var(--y)}
.seg button[aria-pressed="true"]{color:var(--y-ink);background:var(--y);font-weight:700}
/* ══ 程序介绍页 ══
   卡片和行沿用设置页那一套，但版式是自己的：宽屏两栏 + 底部四栏须知。
   860px 单栏在 2K 屏上只占左边一条，右边整片空着——那是把宽度浪费掉了。 */
/* 铺满整屏：外层给高度，内层竖着排，中间那块网格吃掉剩下的高度。
   宽度不再设上限——2K 屏上留 900px 空白纯属浪费，换成三栏。 */
.abwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:1.5rem 2.1rem 2rem;position:relative;
  display:flex;flex-direction:column}
.abin{position:relative;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
/* 四角刻度括号：和流程图那屏同一套装饰语言 */
.abin::before,.abin::after{content:"";position:absolute;width:26px;height:26px;
  pointer-events:none;border-color:var(--line-2)}
.abin::before{left:-12px;top:-8px;border-left:2px solid;border-top:2px solid}
.abin::after{right:-12px;bottom:-14px;border-right:2px solid;border-bottom:2px solid}
.abhero{position:relative;margin-bottom:1.1rem}
/* 巨大水印字收在页尾。放标题右边会和规格带糊在一起——那儿本来就是信息最密的地方 */
.abmark{margin-top:1.4rem;font:800 96px/.82 var(--ui);letter-spacing:.03em;
  color:var(--ink);opacity:.05;pointer-events:none;user-select:none;white-space:nowrap;overflow:hidden}
.abmark i{font-style:normal;font-size:.34em;letter-spacing:.4em;vertical-align:.9em;opacity:.9}
.abhead{position:relative;z-index:1;display:flex;align-items:center;gap:1.3rem;margin-bottom:.8rem}
.abhead .slab{width:9px;height:74px;background:var(--y);flex:0 0 auto}
.abhead h1{font-size:42px;font-weight:800;letter-spacing:.13em;line-height:1.02}
.abhead .lede{font:10px/1 var(--mono);letter-spacing:.24em;color:var(--ink-3);margin-top:.6rem}
.abspec{margin-left:auto;align-self:stretch}
.abspec v.good{color:var(--ok)} .abspec v.bad{color:var(--o)}
@media (max-width:1080px){.abspec{display:none}}

/* ══ 使用说明页 ══
   骨架直接复用介绍页的 .abwrap/.abhero/.abmark，省得再养一套装饰。
   折叠用原生 <details>：不用自己管开合状态，键盘和读屏软件也天然能用。 */
.hpwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:1.5rem 2.1rem 2rem;display:flex;flex-direction:column}
.hpin{position:relative;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.hpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;align-items:start}
@media (max-width:1080px){.hpgrid{grid-template-columns:minmax(0,1fr)}}
.hpcol{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.hphd{font:9.5px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--y);
  display:flex;align-items:center;gap:.5rem;margin:.4rem 0 .1rem}
.hphd i{font-style:normal;color:var(--ink-3);letter-spacing:.1em}
.hphd::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.hpcard{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.hpcard>summary{list-style:none;cursor:var(--cur-p);display:flex;align-items:center;gap:.6rem;
  padding:.6rem .85rem;font-size:13px;font-weight:700;color:var(--ink)}
.hpcard>summary::-webkit-details-marker{display:none}
/* 三角自己画：原生标记在不同浏览器上大小不一，和这套界面也不搭 */
.hpcard>summary::before{content:"";flex:0 0 auto;width:0;height:0;
  border-left:5px solid var(--ink-3);border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .12s}
.hpcard[open]>summary::before{transform:rotate(90deg);border-left-color:var(--y)}
.hpcard>summary:hover{color:var(--y)}
.hpcard>summary span{margin-left:auto;font:8.5px/1 var(--mono);letter-spacing:.18em;color:var(--ink-3)}
.hpcard[open]>summary{border-bottom:1px solid var(--line)}
.hpbody{padding:.7rem .95rem .9rem;font-size:12.5px;line-height:1.75;color:var(--ink-2)}
.hpbody p{margin:0 0 .6rem} .hpbody p:last-child{margin-bottom:0}
.hpbody b{color:var(--ink)}
.hpbody ul{margin:0 0 .6rem;padding-left:1.1rem} .hpbody li{margin:.2rem 0}
.hpbody code{font:11.5px var(--mono);background:var(--panel-3);padding:.05rem .3rem;color:var(--tech)}
/* 例子整段横向可滚：剧本行可能很长，绝不让它把整页顶出横向滚动条 */
.hpcode{font:11.5px/1.7 var(--mono);background:var(--panel-3);color:var(--ink);
  padding:.6rem .7rem;margin:0 0 .6rem;overflow-x:auto;white-space:pre;
  border-left:2px solid var(--y)}
.hptab{width:100%;border-collapse:collapse;margin:0 0 .6rem;display:block;overflow-x:auto}
.hptab td{border-top:1px solid var(--line);padding:.32rem .5rem;vertical-align:top}
.hptab tr:first-child td{border-top:0}
.hptab td:first-child{white-space:nowrap;width:1%;color:var(--ink)}

/* 两栏。三栏试过——内容摊不满，每张卡下半截都空着，比留白还难看。
   两栏让每列的自然高度接近一屏，不用靠拉伸凑。 */
.abgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:1rem;align-items:stretch;flex:1 1 auto;margin-bottom:1rem}
@media (max-width:1080px){.abgrid{grid-template-columns:minmax(0,1fr)}}
.abcol{display:flex;flex-direction:column;gap:1rem;min-width:0}
.abcol>.card{margin-bottom:0}     /* 列自己用 gap 排，卡片再带 margin 就成双份间距 */
/* 屏幕比内容高时，多出来的高度给每列最后一张卡，两列底边就齐了。
   只让卡片长，不去拉伸里面的行——行距被撑到一百多像素时，看着像排版崩了。 */
.abcol>.card:last-child{flex:1 1 auto}

/* 作者卡 */
.abauth{display:flex;gap:1.2rem;padding:1.1rem 0 1rem}
.abface{flex:0 0 auto;width:152px;height:152px;position:relative;background:var(--panel-3);
  box-shadow:inset 0 0 0 1px var(--line-2);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.abface img{width:100%;height:100%;object-fit:cover}
/* 扫描线：实物屏幕的质感，压得很淡，别把头像糊掉 */
.abface::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}
.abwho{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.abwho>b{display:block;font-size:19px;font-weight:700;letter-spacing:.08em}
.abwho .abrole{display:block;font-size:12px;color:var(--ink-3);margin:.28rem 0 .8rem}
.abwho .ablic{margin-top:auto}
.ablink{display:flex;align-items:center;gap:.6rem;text-decoration:none;
  padding:.36rem 0;border-top:1px solid var(--line)}
.ablink k{flex:0 0 auto;width:64px;font:8.5px/1 var(--mono);letter-spacing:.2em;
  color:var(--ink-3);text-transform:uppercase}
.ablink v{font:11px/1.3 var(--mono);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ablink:hover v{color:var(--y)}
.ablic{font:9.5px/1.5 var(--mono);letter-spacing:.06em;color:var(--ink-3);
  padding-top:.5rem;border-top:1px solid var(--line);margin-top:.36rem}

/* 快速上手：这三步是真有先后的（先指目录才谈得上写），所以编号在这里不是装饰 */
.abstep{display:flex;align-items:center;gap:.9rem;padding:.95rem 0;border-bottom:1px solid var(--line)}
.abstep:last-child{border-bottom:0}
.abstep>n{flex:0 0 auto;width:30px;font:800 22px/1 var(--mono);color:var(--line-2);text-align:center}
.abstep[data-done="1"]>n{color:var(--ok)}
.abstep .lbl{flex:1 1 auto;min-width:0}
.abstep .lbl b{display:block;font-size:13.5px;font-weight:600;letter-spacing:.05em}
.abstep .lbl span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:.18rem}
.abstep .go{flex:0 0 auto;display:flex;gap:.4rem}

/* 须知：在第三列里就竖着排，四条各占一格；单栏时也一样 */
.abnotes{display:grid;grid-template-columns:minmax(0,1fr);margin:0 -1.2rem;padding:.1rem 0}
.abcell{padding:1rem 1.2rem;border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.abcell:first-child{border-top:0}
/* 挂牌在 flex 列里会被拉成整条横杠，得钉回内容宽度 */
.abcell>.abkind{align-self:flex-start}
.abcell>b{display:block;font-size:13px;font-weight:600;letter-spacing:.05em;margin:.55rem 0 .3rem}
.abkind{display:inline-block;font:8.5px/1 var(--mono);letter-spacing:.2em;font-weight:700;
  text-transform:uppercase;padding:.28rem .5rem;transform:skewX(var(--sk));
  color:#08201F;background:var(--tech)}
/* 明亮主题的 --tech 是深青，深色字压在上面几乎看不见，得反过来 */
:root[data-theme="light"] .abkind{color:#F1FAF9}
.abkind>span{display:block;transform:skewX(calc(var(--sk) * -1))}

/* 服务端没了时盖住整页。页面关不掉自己，但不能装作还能用 */
.deadwrap{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
.deadbox{background:var(--panel);box-shadow:0 0 0 1px var(--o),0 20px 60px rgba(0,0,0,.6);
  padding:1.4rem 1.8rem;max-width:30rem;border-left:6px solid var(--o)}
.deadbox b{display:block;font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--o)}
.deadbox span{display:block;font-size:12.5px;line-height:1.7;color:var(--ink-2);margin-top:.5rem}

.row>.btn{flex:0 0 auto}
.abrow .ic{flex:0 0 auto;width:26px;height:26px;color:var(--ink-3)}
.abrow .ic svg{width:100%;height:100%;display:block}
/* 能用的模块图标提亮、没做的压暗。这里不给黄——黄在这一页只留给"你在这" */
.abrow[data-on="1"] .ic{color:var(--ink)}
/* 状态挂牌：斜切只给这类挂牌，静止纯平，只有"当前"才配拿黄 */
.abst{flex:0 0 auto;font:9px/1 var(--mono);letter-spacing:.16em;font-weight:700;text-transform:uppercase;
  padding:.32rem .6rem;transform:skewX(var(--sk));color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.abst>span{display:block;transform:skewX(calc(var(--sk) * -1))}
.abst.on{color:var(--y-ink);background:var(--y);box-shadow:none}
.abst.ok{color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.abst.warn{color:var(--o);box-shadow:inset 0 0 0 1px var(--o)}
/* 选择器要压过 `.row .lbl span`（0,2,1），不然字号颜色被它盖回去 */
.row .lbl span.abnote{font-size:12px;line-height:1.65;color:var(--ink-2);margin-top:.35rem}
.row .lbl span.abpath{font:11px/1.5 var(--mono);color:var(--ink-2);margin-top:.45rem;
  word-break:break-all;user-select:text}
.row .lbl span.abpath.none{color:var(--ink-3)}
.abnote{display:block;font-size:12px;line-height:1.65;color:var(--ink-2)}
.abnote code{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--panel-3);padding:.05rem .3rem}
.abnote b{color:var(--ink);font-weight:600}
/* `.row .lbl b` 是 display:block（给行标题用的），说明文字里的 <b> 会被它顶成整行，
   所以这里必须连 .row .lbl 一起写，压过那条 */
.row .lbl span.abnote b{display:inline;color:var(--ink);font-weight:600;font-size:inherit;letter-spacing:0}
.slider{display:flex;align-items:center;gap:.8rem;flex:0 0 auto;width:250px}
.slider input[type=range]{flex:1 1 auto;accent-color:var(--y);cursor:var(--cur-p)}

.rootin{width:100%;background:var(--panel-3);border:1px solid var(--line-2);color:var(--ink);

.rootin:focus{border-color:var(--y)}.demotag{font:8.5px/1 var(--mono);letter-spacing:.1em;background:var(--o);color:#170A03;padding:.05rem .22rem;font-weight:700;margin-left:.4rem}

  margin-left:.45rem;flex:0 0 auto}

/* ══ 偏好存取 ══
   ⚠️ 不能用 localStorage：端口每次启动随机挑，浏览器按「地址+端口」隔离存储，
   端口一换上次存的全部作废——新手引导每次都弹、语言主题每次悄悄回默认就是这么来的。
   正本住在 exe 旁边的 visitapi-editor.txt（pref.* 行），服务端下发页面时注进 window.PREFS
   （见 Program.Ui），脚本第一行就拿得到、不闪错主题；改动走 POST /api/pref 落盘。
   ⚠️ 这一块必须放在 I18N 表**前面**：test-i18n 把「en:{ 到 const T=」之间都当英文表，
   放在表尾和 const T 之间的话，setPref 里的 method:"POST" 会被数成一个没翻译的键。 */
const PREFS=window.PREFS||{};
const pref=k=>PREFS[k]??null;
function setPref(k,v){
  if(v==null||v===""){delete PREFS[k];}else{PREFS[k]=String(v);}
  fetch("/api/pref",{method:"POST",
    headers:{"X-Token":document.querySelector('meta[name=tok]')?.content||"","Content-Type":"application/json"},
    body:JSON.stringify({key:k,value:v==null?"":String(v)})}).catch(()=>{});
}

      <tr><td><code>always</code></td><td>永远显示，见下面那条</td></tr>
    </tbody></table>
    <pre class="hpcode">- 这活我接了。 -&gt; A4 | accept: 65f0e1c2a4b39d7e8c120001
- 东西给你。 | handover: job1 建筑材料, standing: +0.05
- 我们聊过这个了。 | ifnot: job1=未解锁, once</pre>
    <p><b>最容易被绊一下的一条</b>：只写了 <code>accept:</code> / <code>handover:</code> / <code>complete:</code>
      而没写 <code>if:</code> 时，系统会<b>自动</b>补一条门控——接取的选项只在任务「可接取」时出现、
      上交只在「进行中」、交付只在「可提交」。所以"我明明写了，游戏里怎么不显示"，
      多半是任务还没到那个状态。想让它一直显示，加 <code>always</code>。</p>`,

  g_media:"背景、音乐、语音摆在哪一级",
  g_media_b:`<p>三样东西挂的位置不一样，别放错了：</p>
    <table class="hptab"><tbody>
      <tr><td><code>bg:</code></td><td>背景图/视频。节点上写一次管整屏；<b>每条旁白也能各写一个</b>，用来分镜</td></tr>
      <tr><td><code>bgm:</code></td><td>音乐。<b>只能写在节点上</b>，进这个节点就换</td></tr>
      <tr><td><code>audio:</code></td><td>语音。跟着<b>某一句话</b>走：商人台词一条、每条旁白一条</td></tr>
    </tbody></table>
    <p>素材放这两个目录：背景 <code>backgrounds\\</code>、声音 <code>audio\\</code>，都在工作区下面。
      编辑器里挑得到的，游戏里就一定找得到——两边读的是同一个目录。</p>`,

  g_scene:"场景与演员：scene: 和 actor:",
  g_scene_b:`<p>前面那张卡讲的 <code>bg:</code> 是<b>一张平面的背景图或视频</b>。
    <code>scene:</code> 是另一回事——它在对话背后<b>真的加载一个 3D 房间</b>，就是原版"拜访商人"那种。
    顶栏的 <b>scene</b> 那一格点开就能填。</p>
    <table class="hptab"><tbody>
      <tr><td><code>scene: auto</code></td><td>用<b>这个商人自己的</b>房间（按商人 id 去找房间包）</td></tr>
      <tr><td><code>scene: 别的名字</code></td><td>指定用哪个房间包</td></tr>
      <tr><td>不写这一行</td><td>不加载 3D 房间，就是对话框 ＋ <code>bg:</code> 那张图</td></tr>
    </tbody></table>
    <p><b>什么时候真的会加载</b>——这三条都得成立，缺一样就自动跳过（不会报错，只是没有房间）：</p>
    <ul>
      <li>是从<b>商人界面点「对话」</b>进来的。<b>触发点进来的不加载</b>，任务那边跳过来的也不加载</li>
      <li><b>不在战局里</b>。战局里只有对话框</li>
      <li>装了<b>场景包</b>（<code>bundles\\vendors\\</code> 下面有这个商人的房间包）。没装就退回没有房间的样子</li>
    </ul>
    <p><b><code>actor:</code> 现在还没用上。</b>文件里写得下、编辑器存得住、也不会被吃掉，
      但插件那边目前<b>没有任何地方读它</b>——先占个位子。同理 <code>anim:</code> 也还没有入口。
      3D 房间里到底能摆哪些人、能播哪些动作，要等插件那边把原生房间的构成分析完才知道，
      所以这两处编辑器都<b>不给下拉</b>：给一串猜出来的选项等于骗人。</p>`,

  g_q_what:"任务编辑：写出来的是标准 SPT 任务",
  g_q_what_b:`<p>这一页做出来的是<b>普通的 SPT 任务文件</b>（<code>db\\quests\\*.json</code> 加
    <code>db\\locales\\*.json</code>），<b>不依赖 VisitAPI</b>，别的模组照样能用。</p>
    <p>但要知道一件事：<b>SPT 不会自己去某个目录捡任务</b>，得有一个服务端模组去读。
      所以「存到哪」由你定：装了 VisitAPI-Server 就存进它的 <code>db\\quests</code>；
      也可以存进别的模组；或者先存着，以后自己写加载器。</p>
    <p>物品、地图、商人的清单直接读游戏自带数据，不用背那串 24 位的 id。</p>`,

  g_q_tabs:"四个页签，按玩家的时间顺序排",
  g_q_tabs_b:`<table class="hptab"><tbody>
      <tr><td><b>任务卡</b></td><td>玩家看到的那一面：名字、描述、目标、奖励、接取条件</td></tr>
      <tr><td><b>对话</b></td><td>这条任务挂在哪句台词上（见下一张卡）</td></tr>
      <tr><td><b>失败</b></td><td>什么情况算失败、失败了扣什么</td></tr>
      <tr><td><b>属性</b></td><td>能不能重做、失败后能不能重接这类开关</td></tr>
    </tbody></table>
    <p>右边还有一张<b>任务链图</b>：每张卡是一个任务，从卡上拖一条线到另一张卡，就是「先做完这个才能接那个」。
      成环、自己连自己、重复连，都会被拦住。</p>`,

  g_q_obj:"目标怎么写",
  g_q_obj_b:`<p>目标用人话显示：写出来是「击杀 5 个野人（立交桥）」，不是 <code>CounterCreator</code>。
    点行末的 <code>⋮</code> 改数量、换物品、换地图。</p>
    <p>要求更细的话，同一个菜单里有<b>高级设置</b>：必须战局中找到（FiR）、耐久区间、必须一局内完成、
      限时、区域 id、放置耗时、击杀距离和时段。这些字段是把原版一千多条任务条件挨个扫过一遍挑出来的，
      都是原版真在用的。</p>
    <p>武器型号、命中部位那类是列表，暂时没做入口——面板里也照实写着，不会让你以为填了就生效。</p>`,

  g_q_link:"把任务挂到对话上（两步）",
  g_q_link_b:`<p>玩家要点哪句话才接到这个任务？在「对话」页签里两步搞定：</p>
    <ul><li>先挑一个 <code>.dlg</code> 里的节点</li><li>再挑那个节点下面的哪条选项</li></ul>
    <p>挂完那条 <code>.dlg</code> 会被就地改一行——只改那一行，注释和排版一个字不动。
      挂接行点一下能直接跳到对话编辑器，并且<b>正好停在那个节点上</b>。</p>`,

  g_q_save:"文案、校验、保存",
  g_q_save_b:`<p>任务里存的是<b>文案 key</b>，真正的文字在 locales 里。编辑器帮你把这层挡掉了——
    你看到和改的都是文字。右上角能切「你在写哪种语言的文案」，那和界面语言是两回事。</p>
    <p>保存前会跑一遍校验：没目标、完成邮件是空的、前置任务不存在、id 重复、商人找不到……
      只提示，不拦着你存。</p>
    <p>保存用<b>指纹</b>防冲突：文件在编辑器外面被改过（手改、装模组、开了两个窗口），
      它会先问一句，不会默默盖掉别人的改动。每次覆盖前照样留 .bak。</p>`,

  /* ══ Guide ══ one card per idea, click a title to fold it away. */
  hp_lede:"From nothing to a working conversation and a working quest",
  hp_sec_dlg:"Dialogue",hp_sec_q:"Quests · Bots · Traders",
g_bot:"Change a bot's head, body, legs and voice",
g_bot_b:`<p>Sidebar slot 2, "Outfits". Pick a bot type on the left; the right side is split into
<b>head / body / hands / legs / voice</b>. Each part can hold several entries — the number next to one is its
<b>weight</b>: the bigger it is, the more often bots spawn looking like that.</p>
<p>＋ opens the picker, in two sections: <b>made by this mod</b> first, then <b>the stock game</b>.
Both Chinese and English names are searchable.</p>
<p class="hpwarn">Two easy mistakes:</p>
<table class="hptab"><tbody>
<tr><td>The file name is the bot type</td><td>and it <b>must be all lowercase</b>. Name it
<code>bossKilla.json</code> and the game silently ignores it — no error at all. That is why new entries can only be
picked from the list, and why the editor flags a wrong name immediately.</td></tr>
<tr><td>This is about AI, not you</td><td>What the player can wear comes from the trader's clothing, not this page.</td></tr>
</tbody></table>`,
g_shop:"Change what a trader sells and for how much",
g_shop_b:`<p>Sidebar slot 5, "Trader Goods". One row per item: name, price, required loyalty level, and how many
can be bought per refresh. "Add item" lets you pick from all 4000+ items, searchable in either language.</p>
<p class="hpwarn">The one that bites hardest: <b>items that hold something must have their contents written too.</b></p>
<p>Ammo boxes are the classic case. Write only the box and the player pays for a <code>0/20</code> empty one —
and <b>the server reports no error whatsoever</b>, so you only find out by buying one in game.
The editor flags such items in orange and offers "Fill it", which uses the template's own allowed ammo and capacity.</p>
<p>Deleting an item also clears its contents, price and loyalty entry, so nothing is left behind that would show up
but refuse to sell.</p>`,
  hp_tip:"Click a title to fold the card",
  hp_all_open:"Expand all",hp_all_shut:"Collapse all",

  g_intro:"First: what this is, and what you need installed",
  g_intro_b:`<p>This editor does two jobs. They are <b>independent — you can use just one</b>:</p>
    <table class="hptab"><tbody>
      <tr><td><b>Dialogue</b></td><td>makes a trader talk to the player, offer choices, branch. <b>Needs the VisitAPI plugin</b> — that's what actually performs the conversation; the editor only helps you write it correctly</td></tr>
      <tr><td><b>Quests</b></td><td>produces <b>plain SPT quest files</b> and <b>does not need VisitAPI</b>. Any mod that loads quests can use them</td></tr>
    </tbody></table>
    <p>One conversation is one <b>text file</b> ending in <code>.dlg</code>, one per trader, kept in
      <code>&lt;EFT&gt;\\BepInEx\\config\\VisitAPI\\</code>. The editor looks for that folder on start-up;
      if it can't find it, it asks once and then remembers.</p>
    <p>You don't need to write code. A <code>.dlg</code> holds three things: <b>who is talking</b>,
      <b>what they say</b>, and <b>what the player can say back</b>. The next card walks the whole way
      from nothing to seeing it in game.</p>`,

  g_first:"Five minutes: a conversation you can see in game",
  g_first_b:`<p>Follow it once. You don't have to understand any of the terms yet.</p>
    <table class="hptab"><tbody>
      <tr><td><b>1</b></td><td>Sidebar → <b>Dialogue</b>, then <b>Open</b> at the top right. If you have no <code>.dlg</code> at all, make an empty text file called <code>mytrader.dlg</code> in the folder above</td></tr>
      <tr><td><b>2</b></td><td>On the flow graph, click <b>＋</b> to add a node, then double-click its title to name it (plain letters, e.g. <code>hello</code>)</td></tr>
      <tr><td><b>3</b></td><td>Click the node and type the <b>trader's line</b> and the <b>player's options</b> straight into the preview on the left — what you see is what the game shows</td></tr>
      <tr><td><b>4</b></td><td>The <b>⋮</b> on the node title → <b>Make it the entry</b>. That means "this is the screen Talk starts on"</td></tr>
      <tr><td><b>5</b></td><td>If the <b>trader</b> cell in the top bar is empty or wrong, the header is missing a trader id — see the next card</td></tr>
      <tr><td><b>6</b></td><td>Hit <b>Save .DLG</b>. In game, that trader's screen now has a <b>Talk</b> button</td></tr>
    </tbody></table>
    <p>What you just wrote is about six lines:</p>
    <pre class="hpcode">trader: 54cb50c76803fa8b248b4571 "Prapor"
start: hello

&lt;hello&gt;
So you're here. What do you want?
- Just looking. -&gt; @trade
- Nothing. I'm off.</pre>
    <p>Line one says <b>which trader this conversation belongs to</b> (the 24-character thing is the
      trader id — the quest editor's trader list shows them, or copy one from a stock trader).
      Line two says <b>which screen to start on</b>. The rest is that screen.</p>
    <p>No Talk button in game? Almost always one of three things: the plugin isn't installed, the trader id
      is wrong, or the header has a <code>tab:</code> line gating the button (the <b>tab</b> cell in the top
      bar edits it).</p>`,

  g_file:"One .dlg file is one trader's conversation",
  g_file_b:`<p>One file per trader, kept in <code>&lt;EFT&gt;\\BepInEx\\config\\VisitAPI\\</code>.
    Click <b>Open</b> and pick one.</p>
    <p>The left half is a <b>live preview</b> — what you type, in Tarkov's own dialogue box, as you type it.
    The right half is the <b>flow graph</b>: every branch of the story at a glance.</p>
    <p>Saving changes <b>only the lines you actually changed</b>. Your comments, blank lines and layout come
    back exactly as you left them, and a .bak is written before every overwrite.</p>`,

  g_node:"A node is one screen of dialogue",
  g_node_b:`<p>A <b>node</b> is one screenful. It holds up to three things, in this order, all optional:</p>
    <ul>
      <li><b>Narration</b> (lines starting with <code>&gt;</code>) — scene-setting. Write several and the
        player taps through them one at a time</li>
      <li><b>What the trader says</b> — one line per node</li>
      <li><b>Options</b> (lines starting with <code>-</code>) — what the player can say back, as many as you like</li>
    </ul>
    <pre class="hpcode">&lt;root&gt; bg: shopfront.png
&gt; The door opens a crack. No lights inside.
So you came.
- Show me what you've got. -&gt; @trade
- I'll be going.</pre>
    <p>Reads as: background shopfront.png → one line of narration → the trader says "So you came." → two options.</p>`,

  g_name:"Node names are addresses",
  g_name_b:`<p>The name in angle brackets (<code>root</code> above) is <b>only ever used inside the file — the
    player never sees it</b>. Call them whatever you like: <code>root</code>, <code>first_meeting</code>,
    <code>A1</code>. They just have to be unique.</p>
    <p>Their one job is to be <b>the address a jump points at</b>: an option ending in <code>-&gt; A1</code>
    takes the player to <code>&lt;A1&gt;</code>.</p>
    <p><b>Stick to letters, digits, underscore, dot and dash.</b> This editor cannot read a name with
      non-Latin characters in it (the whole node is dropped), so don't use them — the player never sees
      the name anyway.</p>
    <p>Four header lines name a node. They go at the top of the file:</p>
    <table class="hptab"><tbody>
      <tr><td><code>start:</code></td><td>where the conversation begins. Usually a node called root</td></tr>
      <tr><td><code>first:</code></td><td>used <b>only the first time</b> this player meets this trader, never again</td></tr>
      <tr><td><code>when:</code></td><td>swap the entry by level / standing. <b>First match wins</b>; if none match, start: is used</td></tr>
      <tr><td><code>tab:</code></td><td>not a node — it decides whether the trader screen shows the <b>Talk button</b> at all</td></tr>
    </tbody></table>
    <pre class="hpcode">start: root
first: first_meeting
when: level&gt;=4 -&gt; root_high
when: level&gt;=2 -&gt; root_low
tab: if 65f0e1c2a4b39d7e8c120001=Success</pre>
    <p>Reads as: the Talk button only appears once that quest is done; the first meeting goes to
      first_meeting; after that level ≥4 goes to root_high, ≥2 to root_low, anything else to root.</p>`,

  g_special:"Which nodes are special (root isn't one of them)",
  g_special_b:`<p><code>&lt;root&gt;</code> is <b>not a keyword</b> — it's just the name everyone happens to use.
    What actually decides is the <code>start:</code> line in the header. Write <code>start: opening</code>
    and the entry is <code>&lt;opening&gt;</code>; the node called root becomes unreachable.</p>
    <p>These are the ones that really do hold a special position. <b>It isn't the name that's special —
    it's that something points at them</b>:</p>
    <table class="hptab"><tbody>
      <tr><td><b>Entry node</b></td><td>the one <code>start:</code> names. Clicking Talk begins here</td></tr>
      <tr><td><b>First-meeting node</b></td><td>the one <code>first:</code> names. Used <b>only the first time</b> — and only on the Talk path; coming in from a trigger point doesn't count</td></tr>
      <tr><td><b>Tiered entries</b></td><td>the ones <code>when:</code> swaps in by level / standing. Names like <code>root_high</code> / <code>root_low</code> are a convention, not a rule</td></tr>
      <tr><td><b>Trigger node</b></td><td>the one <code>trigger: … node X</code> names — what opens when the player walks up to a spot</td></tr>
      <tr><td><b>Orphans</b></td><td>no option jumps to it and none of the above names it — the player can never see it. The flow graph marks these</td></tr>
    </tbody></table>
    <p><code>@start</code> returns to <b>the entry that <code>when:</code> / <code>start:</code> resolved to</b>:
      if this run came in through <code>root_high</code>, that's where it goes back to. Same when the player
      arrived via a trigger point — it returns to the entry, not to the node the trigger named.</p>
    <pre class="hpcode">start: root
first: first_meeting
when: level&gt;=4 -&gt; root_high

&lt;first_meeting&gt;   ← first meeting comes here
&lt;root&gt;            ← normally comes here
&lt;root_high&gt;       ← high enough level comes here
&lt;C&gt;               ← only a trigger with node C reaches this
&lt;leftover_node&gt;   ← nothing points at it; unreachable (the graph flags it)</pre>`,

  g_trig:"Trigger points: starting a conversation without the trader screen",
  g_trig_b:`<p>Besides clicking Talk on the trader screen, you can let the player <b>walk up to a spot</b> and
    start talking — a room in the hideout, a corner of a map. That's a <code>trigger:</code> line in the header.</p>
    <p>The <b>trigger</b> cell in the top bar opens the editor: add, change, delete (the number is how many
    there are). One trigger holds:</p>
    <table class="hptab"><tbody>
      <tr><td><b>Type</b></td><td><code>hideout</code> or <code>raid</code></td></tr>
      <tr><td><b>Place</b></td><td>hideout: an area name (<code>IntelligenceCenter</code> / <code>Security</code> / <code>Gym</code>…); raid: a map name, <code>*</code> for any map</td></tr>
      <tr><td><b>Position</b></td><td>world coordinates <code>(x, y, z)</code></td></tr>
      <tr><td><b>Which node</b></td><td>leave empty to use the <code>start:</code> entry</td></tr>
      <tr><td><b>How close</b></td><td>distance in metres. Default 3</td></tr>
      <tr><td><b>Aim tolerance</b></td><td>in a raid the player also has to look at it; bigger is easier to hit</td></tr>
      <tr><td><b>Quest gate</b></td><td>only show while a quest is in a given status: <code>questId=status</code></td></tr>
      <tr><td><b>Prompt</b></td><td>the line the player sees; defaults to "Talk"</td></tr>
    </tbody></table>
    <pre class="hpcode">trigger: hideout IntelligenceCenter (0.09, 1.48, 2.71) node C dist 3.5 if 65f0e1c2…=Started "Talk to him"</pre>
    <p>Reads as: while that quest is started, walking within 3.5 m of that spot in the Intelligence Center
      shows "Talk to him", and picking it starts at <code>&lt;C&gt;</code>.</p>
    <p><b>Where do coordinates come from</b>: you have to read them off in game for now. When you save,
      <b>only the line you edited is rewritten</b> — the others keep every decimal exactly as typed.</p>`,

  g_jump:"Where an option can go",
  g_jump_b:`<p>Put a node name after <code>-&gt;</code> to jump there. A few names are reserved:</p>
    <table class="hptab"><tbody>
      <tr><td><code>(nothing)</code></td><td>say the line, then close the conversation</td></tr>
      <tr><td><code>@close</code> <code>@leave</code></td><td>the same thing, spelled out</td></tr>
      <tr><td><code>@trade</code></td><td>close, and switch to the trader's <b>Trade</b> tab</td></tr>
      <tr><td><code>@services</code></td><td>close, and switch to <b>Services</b></td></tr>
      <tr><td><code>@tasks</code></td><td>close, and switch to <b>Tasks</b></td></tr>
      <tr><td><code>@visit</code></td><td>jump into this trader's <b>own stock</b> conversation</td></tr>
      <tr><td><code>@start</code></td><td>back to the entry node and around again</td></tr>
    </tbody></table>
    <p>⚠️ Jumping to a name that doesn't exist <b>closes the conversation</b> in game. The editor marks
      those dead ends on the flow graph.</p>`,

  g_act:"Options can do things too",
  g_act_b:`<p>Add a <code>|</code> after an option and hang actions off it, comma-separated:</p>
    <table class="hptab"><tbody>
      <tr><td><code>accept:</code></td><td><b>takes</b> the quest</td></tr>
      <tr><td><code>complete:</code></td><td><b>hands in</b> the quest</td></tr>
      <tr><td><code>handover:</code></td><td>hand over items (an optional label follows, e.g. "Building materials")</td></tr>
      <tr><td><code>setstatus:</code></td><td>force a quest into a status, skipping the accept/hand-in flow</td></tr>
      <tr><td><code>standing:</code></td><td>change standing, written like <code>+0.05</code></td></tr>
      <tr><td><code>if:</code> / <code>ifnot:</code></td><td>when this option <b>does</b> / <b>doesn't</b> show</td></tr>
      <tr><td><code>once</code></td><td>can be picked exactly once, ever</td></tr>
      <tr><td><code>always</code></td><td>always show — see below</td></tr>
    </tbody></table>
    <pre class="hpcode">- I'll take the job. -&gt; A4 | accept: 65f0e1c2a4b39d7e8c120001
- Here's your stuff. | handover: job1 Building materials, standing: +0.05
- We've been over this. | ifnot: job1=Locked, once</pre>
    <p><b>The one that trips people up</b>: if you write <code>accept:</code> / <code>handover:</code> /
      <code>complete:</code> without an <code>if:</code>, a gate is added <b>automatically</b> — the accept
      option only shows while the quest is available, hand-over only while it's started, hand-in only when
      it's ready. So "I wrote it and it isn't there" is usually the quest not being in that state yet.
      Add <code>always</code> if you want it shown regardless.</p>`,

  g_media:"Where backgrounds, music and voice attach",
  g_media_b:`<p>The three attach at different levels — this is easy to get wrong:</p>
    <table class="hptab"><tbody>
      <tr><td><code>bg:</code></td><td>image or video. On the node it covers the whole screen;
        <b>each narration line can carry its own</b>, which is how you cut between shots</td></tr>
      <tr><td><code>bgm:</code></td><td>music. <b>Node level only</b> — entering the node changes the track</td></tr>
      <tr><td><code>audio:</code></td><td>voice. Belongs to <b>one spoken line</b>: the trader's line, or one narration line</td></tr>
    </tbody></table>
    <p>Files live in two folders under the workspace: <code>backgrounds\\</code> and <code>audio\\</code>.
      Anything you can pick here will resolve in game — the plugin reads the very same folders.</p>`,

  g_scene:"Scene and actor: scene: and actor:",
  g_scene_b:`<p>The <code>bg:</code> from the previous card is <b>a flat image or video</b>.
    <code>scene:</code> is a different thing — it <b>actually loads a 3D room</b> behind the conversation,
    the one stock Tarkov uses when you visit a trader. The <b>scene</b> cell in the top bar edits it.</p>
    <table class="hptab"><tbody>
      <tr><td><code>scene: auto</code></td><td>use <b>this trader's own</b> room (looked up by trader id)</td></tr>
      <tr><td><code>scene: some_name</code></td><td>use that particular room pack</td></tr>
      <tr><td>no line at all</td><td>no 3D room — just the dialogue box and whatever <code>bg:</code> says</td></tr>
    </tbody></table>
    <p><b>When it actually loads</b> — all three have to hold, and if any doesn't it is skipped silently
      (no error, you simply get no room):</p>
    <ul>
      <li>the player came in by <b>clicking Talk on the trader screen</b>. <b>Trigger points don't load it</b>, and neither does jumping in from the quest editor</li>
      <li><b>not in a raid</b>. In a raid you only get the dialogue box</li>
      <li>the <b>scene pack is installed</b> (a room pack for this trader under <code>bundles\\vendors\\</code>). Without it, you fall back to no room</li>
    </ul>
    <p><b><code>actor:</code> is not wired up yet.</b> You can write it, the editor keeps it and never eats it,
      but <b>nothing in the plugin reads it</b> today — it's a placeholder. Same for <code>anim:</code>,
      which has no editor entry at all. Which characters a room can hold and which animations they can play
      depends on work still going on in the plugin repo, so neither field offers a dropdown:
      a list of guesses would be a lie.</p>`,

  g_q_what:"Quests: what comes out is a plain SPT quest",
  g_q_what_b:`<p>This page writes <b>ordinary SPT quest files</b> (<code>db\\quests\\*.json</code> plus
    <code>db\\locales\\*.json</code>). It <b>does not need VisitAPI</b>; any mod can use them.</p>
    <p>One thing to know: <b>SPT does not pick quests up from a folder on its own</b> — a server mod has to
    read them. So where they go is your call: with VisitAPI-Server installed, its own <code>db\\quests</code>;
    or another mod's folder; or keep them and write a loader later.</p>
    <p>Item, map and trader lists come from the game's own data, so nobody has to memorise 24-character ids.</p>`,

  g_q_tabs:"Four tabs, in the order the player meets them",
  g_q_tabs_b:`<table class="hptab"><tbody>
      <tr><td><b>Quest card</b></td><td>the side the player sees: name, description, objectives, rewards, accept conditions</td></tr>
      <tr><td><b>Dialogue</b></td><td>which line of dialogue hands this quest out (next card)</td></tr>
      <tr><td><b>Failure</b></td><td>what counts as failing, and what it costs</td></tr>
      <tr><td><b>Properties</b></td><td>switches like restartable, or can-be-retaken-after-failure</td></tr>
    </tbody></table>
    <p>To the right is the <b>chain graph</b>: one card per quest. Drag from one card to another and that's a
      prerequisite. Loops, self-links and duplicates are refused.</p>`,

  g_q_obj:"Writing objectives",
  g_q_obj_b:`<p>Objectives read as plain language — "kill 5 scavs (Interchange)", not <code>CounterCreator</code>.
    The <code>⋮</code> at the end of a row changes the count, the item, the map.</p>
    <p>For finer control the same menu has <b>Advanced</b>: found-in-raid, durability range, one-raid-only,
      time limit, zone id, plant time, kill distance and time of day. Those fields come from a survey of all
      thousand-plus conditions in the stock quests — they're what the game actually uses.</p>
    <p>Weapon models and body parts are list-valued and have no editor yet. The panel says so rather than
      letting you think a value took effect.</p>`,

  g_q_link:"Hooking a quest onto dialogue (two clicks)",
  g_q_link_b:`<p>Which line does the player have to pick to get this quest? Two steps on the Dialogue tab:</p>
    <ul><li>pick a node in a <code>.dlg</code></li><li>pick which option under that node</li></ul>
    <p>Attaching rewrites <b>one line</b> of that <code>.dlg</code> in place — comments and layout untouched.
      Clicking a hook row jumps you to the dialogue editor and <b>lands on that exact node</b>.</p>`,

  g_q_save:"Text, validation, saving",
  g_q_save_b:`<p>A quest file stores <b>text keys</b>; the actual words live in the locales. The editor hides that
    layer — you see and edit the words. The switch at the top right picks <b>which language you are writing
    in</b>, which is a different thing from the interface language.</p>
    <p>Saving runs a validation pass: no objectives, empty completion mail, missing prerequisite, duplicate id,
      unknown trader… It tells you; it doesn't stop you.</p>
    <p>Saving is guarded by a <b>fingerprint</b>: if the files changed outside the editor (by hand, by a mod,
      by a second window) it asks first instead of quietly overwriting someone's work. A .bak is written every time.</p>`,

  tr_role:"Make this the opening screen",tr_role_d:"Click the ⋮ on the title. You can make this the first thing the player sees when they press Talk, or make it happen only the very first time you meet, or swap the opening by player level or standing.",
  tr_bars:"The shape of the whole script",tr_bars_d:"One bar per screen. Orange ones are openings, teal ones are reached by walking up to a spot. Click one to jump there.",
  tr_src:"See what actually goes in the file",tr_src_d:"This is exactly what the file will look like after you hit Save.",
  tr_save:"Save",tr_save_d:"Writes back to the same file. It makes a backup first, and it never touches the comments or the layout you wrote.",
  tr_q_pane:"Four tabs",tr_q_pane_d:"In the order the player runs into them: the quest card → which line hands it out → what counts as failing → a few switches.",
  tr_q_new:"Make a new quest",tr_q_new_d:"First pick which file it goes in (you can name a new one), then which trader gives it out. The long id is generated for you.",
  tr_q_img:"The picture on the quest card",tr_q_img_d:"Click it to pick one of the game's own icons, or a picture from your own mod folder.",
  tr_q_obj:"Add something for the player to do",tr_q_obj_d:"Kill this many, hand over that, go somewhere… it reads like a sentence, not like code.",
  tr_q_dots:"Change this line",tr_q_dots_d:"The ⋮ changes the count, the item, the map. There's also Advanced in there — things like \"must be found in raid\" or \"has to be done in one raid\".",
  tr_q_graph:"Which quest comes first",tr_q_graph_d:"One card is one quest. Drag a line from one card to another and it means \"finish this one before you can take that one\".",
  tr_q_mail:"The trader's mails and the player's lines",tr_q_mail_d:"A mail from the trader when the quest is taken, finished and failed — plus the few lines the player says.",

  ab_n1:"Where a quest has to live to take effect",
  ab_n1_d:"SPT does not scan arbitrary folders. Its <code>CustomQuestService</code> is an in-memory API for mods to call — <b>it reads no files at all</b>. The code that actually reads files is each mod's own loader. So a quest only counts once it lives under a mod that reads it: install the VisitAPI server mod and it reads <code>db\\quests</code> next to itself.",
